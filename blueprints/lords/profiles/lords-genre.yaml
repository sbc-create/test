schema_version: 1
profile: lords-genre
label: Lords Genre
purpose: >-
  Фасетные посадочные страницы: жанры, годы и страны. Профиль владеет фасетами —
  их индексирует только он.
owns_title_page: false
owns:
  - genre_facet
  - year_facet
  - country_facet
sections:
  genre_facet:
    path: /zhanr/
    page_type: category
    requires: any
    facet: genre
    title: Жанры
    h1: Жанры
    description: Посадочные страницы по жанрам.
    intro: >-
      Жанровая страница существует не потому, что жанр есть в справочнике, а
      потому, что за ним стоит достаточный список произведений. Пустой или почти
      пустой жанр страницы не получает: она была бы обещанием, которое нечем
      выполнить. Значения жанров берутся из источника данных, а не из
      собственного справочника, чтобы фильтр и страница не расходились.
  year_facet:
    path: /god/
    page_type: category
    requires: any
    facet: year
    title: Годы выпуска
    h1: Годы выпуска
    description: Посадочные страницы по годам выпуска.
    intro: >-
      Год выпуска — самый простой способ сузить выбор, когда жанр не помогает:
      зритель помнит время, а не категорию. Страница года показывает, что вышло
      именно тогда, и не смешивает это с тем, что тогда же было добавлено в
      каталог. Годы без произведений в списке не появляются.
  country_facet:
    path: /strana/
    page_type: category
    requires: any
    facet: country
    title: Страны
    h1: Страны производства
    description: Посадочные страницы по странам производства.
    intro: >-
      Страна производства для части зрителей важнее жанра: она задаёт манеру
      съёмки, темп и интонацию сильнее формальной категории. Страница страны
      собирает произведения по этому признаку из данных источника. Страны, за
      которыми в каталоге ничего нет, страницы не получают — иначе список
      наполнился бы адресами, ведущими в пустоту.
