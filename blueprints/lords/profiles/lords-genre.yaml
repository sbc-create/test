schema_version: 1
profile: lords-genre
label: Lords Genre
purpose: >-
  Фасетные посадочные страницы: жанры, годы и страны. Профиль владеет фасетами.
owns_title_page: false
owns:
  - genres_index
  - years_index
  - countries_index

theme:
  name: lords_light
  tokens:
    bg: "#f4f6f8"
    surface: "#ffffff"
    surface_alt: "#e9edf2"
    text: "#151a21"
    muted: "#5b6674"
    accent: "#1f6f5c"
    accent_text: "#ffffff"
    border: "#d3dae2"
    radius: "14px"
    container: "1320px"
    heading_font: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif

layout:
  density: compact
  hero: facets
  card_ratio: "2 / 3"
  columns: { mobile: 2, tablet: 5, desktop: 8 }
  # latest_grid добавлен не для красоты: приёмка боевого обновления ищет на
  # главной class="card" и без карточек возвращает прежний релиз
  # (automation/host/lords-content-refresh.sh:233). Витрина фасетов остаётся
  # витриной фасетов — сетка стоит под плашками, а не над ними.
  home_blocks: [hero_facets, genre_chips, year_grid, country_grid, latest_grid]
  show_calendar: false
  show_collection_cards: false
  facet_position: hero

sections:
  home:
    title: Жанры, годы и страны — навигация по каталогу
    h1: Навигация по каталогу
    description: "Главная фасетного профиля: жанры, годы выпуска и страны производства."
    intro: >-
      Главная этого сайта — не витрина, а указатель. Экран занят тремя наборами
      значений: жанры, годы и страны, каждое ведёт на свою посадочную страницу.
      Значение попадает в указатель, только если за ним есть произведения:
      ссылка, ведущая в пустой список, дороже обходится зрителю, чем её
      отсутствие.
  search:
    title: Поиск по каталогу
    h1: Поиск
    description: Поиск по названиям каталога.
    intro: >-
      Поиск дополняет фасеты там, где зритель помнит название, а не признак.
      Он работает по данным каталога и никуда не обращается наружу. Страница
      результатов закрыта от индексации как служебная.
  genres_index:
    title: Жанры
    h1: Жанры
    description: Посадочные страницы по жанрам.
    intro: >-
      Жанровая страница существует не потому, что жанр есть в справочнике, а
      потому, что за ним стоит достаточный список произведений. Пустой жанр
      страницы не получает: она была бы обещанием, которое нечем выполнить.
      Значения берутся из источника данных, а не из собственного справочника,
      чтобы фильтр и страница не расходились.
  years_index:
    title: Годы выпуска
    h1: Годы выпуска
    description: Посадочные страницы по годам выпуска.
    intro: >-
      Год выпуска — самый простой способ сузить выбор, когда жанр не помогает:
      зритель помнит время, а не категорию. Страница года показывает, что вышло
      именно тогда, и не смешивает это с тем, что тогда же было добавлено в
      каталог. Годы без произведений в списке не появляются.
  countries_index:
    title: Страны
    h1: Страны производства
    description: Посадочные страницы по странам производства.
    intro: >-
      Страна производства для части зрителей важнее жанра: она задаёт манеру
      съёмки, темп и интонацию сильнее формальной категории. Страница собирает
      произведения по этому признаку из данных источника. Страны, за которыми в
      каталоге ничего нет, страницы не получают — иначе список наполнился бы
      адресами, ведущими в пустоту.
