schema_version: 1
profile: lords-general
label: Lords General
purpose: >-
  Основной каталог направления: фильмы и сериалы, страницы произведений,
  поиск и фильтры. Профиль владеет карточкой произведения — её индексирует
  только он.
owns_title_page: true
owns:
  - movies_index
  - series_index
  - animation_index
  - anime_index
  - dorama_index
sections:
  movies_index:
    path: /filmy/
    page_type: category
    requires: movies
    title: Каталог фильмов
    h1: Каталог фильмов
    description: Полный список фильмов каталога с фильтрами по жанру, году и стране.
    intro: >-
      Раздел собирает фильмы каталога в один список и даёт добраться до нужного
      за два-три шага: сузить выбор фильтром, отсортировать и открыть карточку.
      Здесь нет редакционного отбора и нет подборок — это полный перечень того,
      что доступно к просмотру, в том виде, в каком его отдаёт источник данных.
      Каждая карточка ведёт на страницу произведения, где собраны факты о нём и
      доступные варианты просмотра.
  series_index:
    path: /serialy/
    page_type: category
    requires: series
    title: Каталог сериалов
    h1: Каталог сериалов
    description: Список сериалов с разбивкой по сезонам и сериям.
    intro: >-
      Список сериалов устроен иначе, чем список фильмов: у сериала есть сезоны и
      серии, и раздел ведёт не к одному видео, а к структуре из нескольких
      уровней. Карточка показывает, сколько сезонов вышло и на какой серии
      остановился выпуск, чтобы выбор не приходилось делать вслепую. Отдельные
      серии открываются со страницы сезона, а не из общего списка.
  animation_index:
    path: /multfilmy/
    page_type: category
    requires: animation
    title: Каталог мультфильмов
    h1: Каталог мультфильмов
    description: Мультфильмы и мультсериалы каталога.
    intro: >-
      Мультипликация вынесена в отдельный раздел, потому что её ищут иначе:
      здесь чаще важны возрастная отметка и продолжительность, чем год выпуска
      или страна. Раздел объединяет полнометражные мультфильмы и мультсериалы,
      а разделение между ними видно в карточке — у сериальной формы указаны
      сезоны и серии.
  anime_index:
    path: /anime/
    page_type: category
    requires: anime
    title: Каталог аниме
    h1: Каталог аниме
    description: Аниме-сериалы и полнометражное аниме.
    intro: >-
      Раздел отделён от общей мультипликации: у аниме своя система сезонов
      выпуска, свои студии и свой порядок просмотра, и смешивать его с
      мультфильмами значило бы усложнить поиск обеим аудиториям. Внутри раздела
      действуют те же фильтры, что и в остальном каталоге, но список
      ограничен произведениями этого типа.
  dorama_index:
    path: /dorama/
    page_type: category
    requires: dorama
    title: Каталог дорам
    h1: Каталог дорам
    description: Дорамы и азиатские сериалы.
    intro: >-
      Дорамы выделены в самостоятельный раздел по той же причине, что и аниме:
      это отдельная зрительская привычка со своим ритмом выхода серий и своими
      странами производства. Раздел показывает список без редакционного отбора,
      а карточка произведения ведёт к сезонам и сериям.
title_page:
  page_type: title
  title_template: "{name} — смотреть онлайн"
  h1_template: "{name}"
  description_template: "Страница произведения «{name}»: факты, сезоны и доступные варианты просмотра."
  intro: >-
    Страница произведения собирает то, что о нём известно из источника данных:
    оригинальное название, год, страну, студию, жанры и состав сезонов. Оценок,
    отзывов и пересказов сюжета здесь нет — карточка отвечает на вопрос «что это
    и можно ли это посмотреть», а не заменяет собой рецензию.
