schema_version: 1
profile: lords-general
label: Lords General
purpose: >-
  Основной каталог направления: фильмы и сериалы, страницы произведений, поиск и
  фильтры. Профиль владеет каталогом и карточкой произведения.
owns_title_page: true
# Три нишевых раздела — animation_index, anime_index, dorama_index — ушли из
# владения этого профиля к lords-animation, lords-anime и lords-dorama.
# Причина: пул профилей семейства был исчерпан, а правило
# `ownership_rule: exactly_one_owner_per_section` не допускает второго
# владельца у раздела. Разделы у витрины lords-general ОСТАЮТСЯ и продолжают
# работать — меняется только то, КТО их индексирует, а сегодня не индексирует
# никто: ячейки Lords целиком отдают `noindex, nofollow`. Обратный ход —
# вернуть три строки сюда и убрать три профиля из пула.
owns:
  - catalog_index
  - movies_index
  - series_index

theme:
  name: lords_dark
  tokens:
    bg: "#111111"
    surface: "#1c1c1c"
    surface_alt: "#252525"
    text: "#e6e6e6"
    muted: "#9a9a9a"
    accent: "#79c142"
    accent_text: "#0d0d0d"
    border: "#333333"
    radius: "4px"
    container: "1240px"
    heading_font: "'Open Sans', 'Segoe UI', Roboto, Arial, sans-serif"

layout:
  density: comfortable
  hero: catalog
  card_ratio: "2 / 3"
  columns: { mobile: 2, tablet: 4, desktop: 6 }
  # hero_search стоит первым, потому что первый экран рисуется до цикла по
  # home_blocks: в прежнем порядке манифест обещал карусель выше поиска, а
  # на странице поиск всё равно был выше. Разметка не менялась — менялось
  # только обещание.
  home_blocks: [hero_search, top_carousel, latest_grid, type_rows, top_rated, genre_chips, year_grid]
  carousel_heading: Новинки каталога
  show_calendar: false
  show_collection_cards: false
  facet_position: sidebar

sections:
  home:
    title: Каталог фильмов и сериалов онлайн
    h1: Смотреть фильмы и сериалы
    description: "Главная страница каталога: свежие поступления, разделы по типам и переход к фильтрам."
    intro: >-
      Главная показывает состояние каталога на текущий момент: что добавлено
      последним, какие типы материалов доступны и куда вести дальше. Она не
      пытается быть витриной с отбором — задача проще и честнее: за один экран
      показать объём каталога и дать три коротких пути внутрь — по типу, по
      жанру и через поиск. Ничего, что не подтверждено источником данных, здесь
      не появляется.
  search:
    title: Поиск по каталогу
    h1: Поиск
    description: Поиск по названиям каталога.
    intro: >-
      Поиск ищет по названиям того, что уже есть в каталоге, и не обращается
      наружу. Страница результатов служебная: она закрыта от индексации, потому
      что её содержимое зависит от запроса и одинакового адреса с одинаковым
      содержимым у неё не бывает.
  catalog_index:
    title: Каталог
    h1: Каталог
    description: Полный каталог с фильтрами по типу, жанру, году и стране.
    intro: >-
      Каталог собирает всё доступное в один список и даёт добраться до нужного за
      два-три шага: сузить выбор фильтром, отсортировать и открыть карточку.
      Редакционного отбора здесь нет — это перечень того, что отдаёт источник
      данных, в том порядке, который выбрал зритель.
  movies_index:
    title: Фильмы
    h1: Фильмы
    description: Полнометражные фильмы каталога с фильтрами.
    intro: >-
      Раздел показывает только полнометражное: у фильма нет сезонов, и путь от
      списка до просмотра короче, чем у сериала. Фильтры те же, что в общем
      каталоге, но список ограничен этим типом, поэтому пагинация не смешивает
      разные формы.
  series_index:
    title: Сериалы
    h1: Сериалы
    description: Сериалы с разбивкой по сезонам и сериям.
    intro: >-
      Список сериалов устроен иначе, чем список фильмов: у сериала есть сезоны и
      серии, и раздел ведёт не к одному видео, а к структуре из нескольких
      уровней. Карточка показывает, сколько сезонов вышло, чтобы выбор не
      приходилось делать вслепую.
title_page:
  title_template: "{name} — смотреть онлайн"
  h1_template: "{name}"
  description_template: "{name}: факты, сезоны и доступные варианты просмотра."
  intro: >-
    Страница произведения собирает то, что о нём известно из источника данных:
    оригинальное название, год, страну, студию, жанры и состав сезонов. Оценок,
    отзывов и пересказов сюжета здесь нет — карточка отвечает на вопрос «что это
    и можно ли это посмотреть».
