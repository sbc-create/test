schema_version: 1
profile: lords-films
label: Lords Films
purpose: >-
  ОБЩИЙ каталог фильмов: полный метр по жанрам, годам и странам, а не одна
  тема. Профиль ведёт фильмовым направлением и не присваивает себе разделы
  работающих витрин сети.
# Ничего не владеет СОЗНАТЕЛЬНО — по той же причине, что у `lords-serials`:
# правило `exactly_one_owner_per_section` занято целиком, а забрать
# `movies_index` у lords-general значило бы уменьшить индексируемую поверхность
# работающего lordfilm47.space. Отдачу страниц это не ограничивает: рантайм про
# `owns` не знает, индексируемость решает режим индексации. Но редакционные
# тексты разделов каталога планировщик отдаёт только владельцу, поэтому их здесь
# нет — разбор в конце файла и в `lords-serials.yaml`.
owns_title_page: false
owns: []

theme:
  name: lords_dark
  tokens:
    bg: "#0d0f1a"
    surface: "#1a1c2e"
    surface_alt: "#23263c"
    text: "#f0eef6"
    muted: "#a0a0bb"
    accent: "#d2544b"
    accent_text: "#ffffff"
    border: "#2f3350"
    radius: "4px"
    container: "1240px"
    heading_font: "'Open Sans', 'Segoe UI', Roboto, Arial, sans-serif"

layout:
  density: comfortable
  hero: catalog
  card_ratio: "2 / 3"
  columns: { mobile: 2, tablet: 4, desktop: 6 }
  home_blocks: [hero_search, top_carousel, latest_grid, genre_chips, top_rated, year_grid]
  carousel_heading: "Фильмы, которые смотрят сейчас"
  show_calendar: false
  show_collection_cards: false
  facet_position: sidebar

sections:
  home:
    title: "Фильмы онлайн — полный метр по жанрам и годам"
    h1: "Смотреть фильмы онлайн"
    description: "Общий каталог фильмов: новые поступления, жанры, годы и страны."
    intro: >-
      Главная показывает состояние фильмового каталога: что добавлено
      последним, какие жанры и годы доступны и куда идти дальше. Это общий
      каталог, а не тематическая витрина: мультфильмы и зарубежное кино здесь
      такие же фильмы, как остальные. Путь до просмотра у фильма короче, чем у
      сериала, — сезонов нет, — и главная этим и пользуется: от списка сразу к
      карточке. Ничего, что не подтверждено снимком каталога, здесь не
      появляется.
  search:
    title: "Поиск по каталогу фильмов"
    h1: "Поиск"
    description: "Поиск по названиям фильмов каталога."
    intro: >-
      Поиск ищет оригинальное и русское названия сразу. Страница результатов
      служебная и закрыта от индексации: её содержимое зависит от запроса, и
      одинакового адреса с одинаковым содержимым у неё не бывает.
# ТЕКСТОВ РАЗДЕЛОВ КАТАЛОГА ЗДЕСЬ НЕТ, И ЭТО СЛЕДСТВИЕ, А НЕ ПРОПУСК.
#
# `factory/lords/plan.py: build_plan` отдаёт тексты раздела ТОЛЬКО его
# владельцу; `home` и `search` — исключение (`NON_OWNABLE` в
# `factory/templates/contract.py`), они есть у каждой витрины и потому
# объявлены выше. Профиль ничем не владеет (разбор — в заголовке файла),
# значит любой текст для `movies_index, catalog_index` на страницу НЕ попал бы.
#
# Первая версия этого файла такие тексты несла, и ворота контракта шаблона
# поймали это с формулировкой «тексты раздела … не попадут на страницу».
# Проверка права: мёртвые данные, выглядящие содержимым, хуже отсутствия
# данных — их видно в репозитории и не видно на сайте.
#
# Что при этом получает посетитель: заголовки разделов рантайм собирает сам из
# имени витрины — измерено 2026-10-06 на локальном запуске, `/series/` отдал
# «Сериалы — LordSerial101», `/movies/` — «Фильмы — LordFilm077». Пустых
# страниц нет; нет именно редакционного вступления, и появится оно тогда,
# когда витрина получит раздел во владение.
