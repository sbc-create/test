schema_version: 1
profile: lords-curated
label: Lords Curated
purpose: >-
  Редакционный отбор: подборки и тематические страницы, собранные человеком.
  Профиль владеет подборками — их индексирует только он.
owns_title_page: false
owns:
  - collections_index
sections:
  collections_index:
    path: /podborki/
    page_type: collection
    requires: collections
    title: Подборки
    h1: Подборки
    description: Тематические списки, собранные редакцией.
    intro: >-
      Подборка — это не результат фильтра, а список, у которого есть автор и
      причина существования. Фильтр отвечает на вопрос «покажи всё, что подходит
      под условие», подборка — на вопрос «с чего начать, если хочется именно
      такого». Поэтому у каждой подборки есть собственное вступление,
      объясняющее принцип отбора, и её состав не пересобирается автоматически
      при изменении каталога: изменения вносит человек. Оценок и рейтингов в
      подборках нет — сравнивать произведения между собой редакция не берётся.
    editorial_rules:
      - Состав подборки задаёт человек, а не запрос к каталогу.
      - У подборки обязательно собственное вступление, объясняющее принцип отбора.
      - Оценки, баллы и места в рейтинге не проставляются.
      - Пустая подборка не публикуется.
