schema_version: 1
profile: lords-curated
label: Lords Curated
purpose: >-
  Редакционный отбор: подборки и тематические страницы, собранные человеком.
  Профиль владеет подборками.
owns_title_page: false
owns:
  - collections_index

theme:
  name: lords_light
  tokens:
    bg: "#faf8f4"
    surface: "#ffffff"
    surface_alt: "#f1ece3"
    text: "#1d1a16"
    muted: "#6b6357"
    accent: "#9c4221"
    accent_text: "#ffffff"
    border: "#e0d8cb"
    radius: "2px"
    container: "1080px"
    heading_font: Georgia, 'Times New Roman', serif

layout:
  density: airy
  hero: editorial
  card_ratio: "3 / 2"
  columns: { mobile: 1, tablet: 2, desktop: 3 }
  home_blocks: [hero_editorial, collection_cards, latest_grid, type_rows, top_rated, genre_chips, editor_note]
  show_calendar: false
  show_collection_cards: true
  facet_position: none

sections:
  home:
    title: Подборки — тематические списки каталога
    h1: Подборки
    description: "Главная профиля подборок: тематические списки и переход к каталогу."
    intro: >-
      Здесь первично не количество, а группировка. Главная открывается
      несколькими тематическими списками, каждый из которых собран по понятному
      признаку и подписан этим признаком. Подборка живёт, пока за ней стоят
      произведения; список, оставшийся без наполнения, со страницы исчезает
      целиком, а не превращается в пустой заголовок.
  search:
    title: Поиск по подборкам и каталогу
    h1: Поиск
    description: Поиск по названиям каталога.
    intro: >-
      Поиск охватывает весь каталог, включая произведения внутри подборок.
      Выдача остаётся служебной страницей и в индекс не отдаётся: содержимое
      меняется вместе с запросом, а постоянного адреса у результата нет.
  collections_index:
    title: Подборки
    h1: Подборки
    description: Тематические списки, собранные редакцией.
    intro: >-
      Подборка — это не результат фильтра, а список, у которого есть автор и
      причина существования. Фильтр отвечает на вопрос «покажи всё, что подходит
      под условие», подборка — на вопрос «с чего начать, если хочется именно
      такого». Поэтому у каждой есть собственное вступление, объясняющее принцип
      отбора, и её состав не пересобирается автоматически при изменении
      каталога: изменения вносит человек. Оценок и рейтингов в подборках нет —
      сравнивать произведения между собой редакция не берётся.
    editorial_rules:
      - Состав подборки задаёт человек, а не запрос к каталогу.
      - У подборки обязательно собственное вступление.
      - Оценки, баллы и места в рейтинге не проставляются.
      - Пустая подборка не публикуется.
