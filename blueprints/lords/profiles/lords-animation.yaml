schema_version: 1
profile: lords-animation
label: Lords Animation
purpose: >-
  Мультфильмы и мультсериалы. Профиль владеет разделом анимации.
owns_title_page: false
owns:
  - animation_index

theme:
  name: lords_dark
  tokens:
    bg: "#101410"
    surface: "#1a1f19"
    surface_alt: "#232a20"
    text: "#eaf0e4"
    muted: "#9aa791"
    accent: "#8a6412"
    accent_text: "#ffffff"
    border: "#2f3829"
    radius: "4px"
    container: "1240px"
    heading_font: "'Open Sans', 'Segoe UI', Roboto, Arial, sans-serif"

layout:
  density: airy
  hero: catalog
  card_ratio: "2 / 3"
  columns: { mobile: 2, tablet: 4, desktop: 6 }
  home_blocks: [hero_search, top_carousel, type_rows, latest_grid, year_grid]
  carousel_heading: "Мультфильмы для семейного просмотра"
  show_calendar: false
  show_collection_cards: false
  facet_position: none

sections:
  home:
    title: "Мультфильмы и мультсериалы"
    h1: "Мультфильмы"
    description: "Главная профиля анимации: полнометражные и сериалы."
    intro: >-
      Раздел ведёт пометка «мультфильм» из снимка каталога. Её проставляет
      источник, и часть анимации сегодня приходит без неё — такие записи
      попадают в сериалы, потому что по данным источника они и есть
      сериалы. Классифицировать по названию витрина не будет: это ломается
      на первом же исключении.

  search:
    title: "Поиск по каталогу"
    h1: "Поиск"
    description: "Поиск по названиям каталога."
    intro: >-
      Поиск не ограничен анимацией: мультсериал и его полнометражное
      продолжение нередко лежат в разных разделах, и отсечь половину значит
      ответить неправдой. Выдача остаётся служебной страницей и в индекс не
      отдаётся.
  animation_index:
    title: "Мультфильмы и мультсериалы"
    h1: "Мультфильмы"
    description: "Полнометражная анимация и мультсериалы из каталога."
    intro: >-
      Здесь и полный метр, и сериальная анимация: разделяет их тип записи,
      а не отдельный раздел. Аниме и дунхуа сюда не попадают — у них своя
      пометка и свой домен.
    editorial_rules:
      - Раздел ведёт пометка источника, а не название произведения.
      - Аниме и дунхуа в раздел анимации не сводятся.
      - Пропущенная пометка — дефект снимка; поимённые правки заводятся
        только по стабильному идентификатору с записанным основанием.
