schema_version: 1
profile: lords-dorama
label: Lords Dorama
purpose: >-
  Дорамы Кореи, Японии и Китая: страна, год и сезон. Профиль владеет разделом дорам.
owns_title_page: false
owns:
  - dorama_index

theme:
  name: lords_dark
  tokens:
    bg: "#150f12"
    surface: "#211a1d"
    surface_alt: "#2b2126"
    text: "#f2e9eb"
    muted: "#b39aa1"
    accent: "#a4436a"
    accent_text: "#ffffff"
    border: "#3a2c31"
    radius: "4px"
    container: "1240px"
    heading_font: "'Open Sans', 'Segoe UI', Roboto, Arial, sans-serif"

layout:
  density: airy
  hero: editorial
  card_ratio: "2 / 3"
  columns: { mobile: 2, tablet: 4, desktop: 6 }
  home_blocks: [top_carousel, collection_cards, latest_grid, type_rows, top_rated]
  carousel_heading: "Дорамы, которые смотрят сейчас"
  show_calendar: false
  show_collection_cards: true
  facet_position: none

sections:
  home:
    title: "Дорамы — корейские, японские и китайские сериалы"
    h1: "Дорамы"
    description: "Главная профиля дорам: страна, год и состояние выхода."
    intro: >-
      Дорама отличается от сериала не жанром, а происхождением, поэтому
      первое, что показывает эта витрина, — страна и год. Оба поля
      приходят из снимка каталога. Там, где источник страну не передал,
      запись остаётся без страны, а не приписывается Корее по умолчанию.

  search:
    title: "Поиск по каталогу"
    h1: "Поиск"
    description: "Поиск по названиям каталога."
    intro: >-
      Ищутся оригинальное и русское названия сразу: у дорамы их обычно два, и
      посетитель помнит то, которое встретил первым. Область поиска — весь
      каталог; выдача остаётся служебной страницей и в индекс не отдаётся.
  dorama_index:
    title: "Дорамы"
    h1: "Дорамы"
    description: "Дорамы Кореи, Японии и Китая из каталога."
    intro: >-
      Состав раздела задаёт классификация источника. Страна берётся из
      поля countries снимка; при нескольких странах показываются все, в
      порядке источника. Домысливать страну по студии или названию витрина
      не будет: первая же ошибка такого рода необратима для посетителя,
      который искал корейское.
    editorial_rules:
      - Страна и год — только из снимка каталога.
      - Страна не выводится из названия, студии или языка озвучки.
      - Пустая страна показывается как отсутствие, а не как «Корея».
