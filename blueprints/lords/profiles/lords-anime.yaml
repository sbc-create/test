schema_version: 1
profile: lords-anime
label: Lords Anime
purpose: >-
  Аниме и дунхуа: серии, сезоны и озвучки. Профиль владеет разделом аниме.
owns_title_page: false
owns:
  - anime_index

theme:
  name: lords_dark
  tokens:
    bg: "#0d1016"
    surface: "#171b26"
    surface_alt: "#1f2434"
    text: "#e8eaf3"
    muted: "#99a0b8"
    accent: "#4a5bb5"
    accent_text: "#ffffff"
    border: "#2c3245"
    radius: "4px"
    container: "1240px"
    heading_font: "'Open Sans', 'Segoe UI', Roboto, Arial, sans-serif"

layout:
  density: dense
  hero: timeline
  card_ratio: "2 / 3"
  columns: { mobile: 2, tablet: 4, desktop: 6 }
  home_blocks: [top_carousel, latest_grid, type_rows, top_rated, genre_chips]
  carousel_heading: "Аниме этого сезона"
  show_calendar: false
  show_collection_cards: false
  facet_position: none

sections:
  home:
    title: "Аниме и дунхуа — серии, сезоны и озвучки"
    h1: "Аниме"
    description: "Главная профиля аниме: что вышло, что продолжается, что можно начать."
    intro: >-
      Первым экраном идут аниме и дунхуа — то, ради чего сюда приходят.
      Сезон и номер серии берутся из снимка каталога; если источник их не
      передал, строка не дорисовывается догадкой, а просто отсутствует.
      Раздел с мультфильмами рядом есть, но он чужой: его ведёт другой
      домен, и здесь он остаётся навигацией.

  search:
    title: "Поиск по каталогу"
    h1: "Поиск"
    description: "Поиск по названиям каталога."
    intro: >-
      Поиск идёт по всему каталогу, а не только по аниме: искомое название
      часто помнят в одном написании, а в снимке оно в другом, и сужать
      область поиска значит терять записи. Выдача остаётся служебной
      страницей и в индекс не отдаётся.
  anime_index:
    title: "Аниме и дунхуа"
    h1: "Аниме"
    description: "Аниме и дунхуа из каталога: сериалы, полнометражные, онтины."
    intro: >-
      Раздел собирается нормализованной классификацией источника, а не по
      названию: «мультфильм» и «аниме» — разные пометки, и путать их
      значит терять и то и другое. Запись без пометки в раздел не попадает
      — это дефект снимка, а не повод угадывать.
    editorial_rules:
      - Раздел ведёт нормализованная классификация источника, а не название.
      - Сезон и серия показываются, только если они есть в снимке.
      - "Озвучка не выдумывается: её либо передал источник, либо её нет."
