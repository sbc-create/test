schema_version: 1
profile: lords-new
label: Lords New
purpose: >-
  Актуальность: что появилось только что, какие серии вышли и что выйдет дальше.
  Профиль владеет новинками и расписанием.
owns_title_page: false
owns:
  - new_index
  - schedule

theme:
  name: lords_dark
  tokens:
    bg: "#0d1117"
    surface: "#161b24"
    surface_alt: "#1d2530"
    text: "#eef1f5"
    muted: "#93a0b0"
    accent: "#ff9f45"
    accent_text: "#1a1206"
    border: "#2c3542"
    radius: "6px"
    container: "1180px"
    heading_font: "system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"

layout:
  density: dense
  hero: timeline
  card_ratio: "16 / 9"
  columns: { mobile: 1, tablet: 3, desktop: 4 }
  home_blocks: [hero_timeline, latest_grid, fresh_episodes, type_rows, top_rated, calendar, genre_chips]
  show_calendar: true
  show_collection_cards: false
  facet_position: top

sections:
  home:
    title: Новинки каталога — что вышло и что добавлено
    h1: Новое в каталоге
    description: "Главная профиля новинок: лента поступлений и календарь выхода серий."
    intro: >-
      Эта главная построена вокруг времени, а не вокруг объёма. Первым идёт то,
      что появилось недавно, дальше — календарь ближайших серий, и только потом
      переходы в остальные разделы. Разница между «вышло» и «добавлено к нам»
      здесь принципиальна и подписана явно: путать их значит обещать зрителю
      премьеру там, где её нет.
  search:
    title: Поиск по новинкам
    h1: Поиск
    description: Поиск по названиям каталога.
    intro: >-
      Поле поиска работает по тем же данным, что и остальные разделы, и не
      выходит за пределы каталога. Результаты выдачи закрыты от индексации:
      адрес зависит от запроса, а страница без устойчивого содержимого не
      должна попадать в индекс.
  new_index:
    title: Новинки
    h1: Что появилось недавно
    description: Недавно добавленные произведения и свежие серии.
    intro: >-
      Раздел отвечает на один вопрос: что нового с прошлого захода. Порядок
      задаёт дата появления, а не популярность и не оценка, поэтому список
      меняется каждый день и не повторяет каталог. Свежая серия давно идущего
      сериала попадает сюда наравне с только что добавленным фильмом: для
      зрителя это одинаково новость.
  schedule:
    title: Расписание выхода серий
    h1: Расписание выхода серий
    description: Календарь ближайших серий по дням.
    intro: >-
      Расписание показывает ближайшие серии по дням и нужно тем, кто смотрит
      сериалы по мере выхода, а не залпом. Здесь важна не полнота, а близость
      даты: чем дальше срок, тем меньше о нём известно, и неподтверждённая дата
      в расписание не попадает. Прошедшие дни уходят в новинки.
