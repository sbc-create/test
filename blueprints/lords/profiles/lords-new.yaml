schema_version: 1
profile: lords-new
label: Lords New
purpose: >-
  Актуальность: что появилось только что, какие серии вышли и что выйдет
  дальше. Профиль владеет новинками и расписанием.
owns_title_page: false
owns:
  - new_index
  - schedule
sections:
  new_index:
    path: /novinki/
    page_type: category
    requires: any
    title: Новинки
    h1: Что появилось недавно
    description: Недавно добавленные произведения и свежие серии.
    intro: >-
      Раздел отвечает на один вопрос: что нового с прошлого захода. Порядок
      здесь задаёт дата появления, а не популярность и не оценка, поэтому список
      меняется каждый день и не повторяет каталог. Свежая серия давно идущего
      сериала попадает сюда наравне с только что добавленным фильмом: для
      зрителя это одинаково новость.
  schedule:
    path: /raspisanie/
    page_type: category
    requires: series
    title: Расписание выхода серий
    h1: Расписание выхода серий
    description: Календарь ближайших серий по дням.
    intro: >-
      Расписание показывает ближайшие серии по дням и нужно тем, кто смотрит
      сериалы по мере выхода, а не залпом. В отличие от каталога здесь важна не
      полнота, а близость даты: чем дальше срок, тем меньше о нём известно, и
      неподтверждённая дата в расписание не попадает. Прошедшие дни уходят в
      раздел новинок.
