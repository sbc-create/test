schema_version: 1
profile: lords-serials
label: Lords Serials
purpose: >-
  ОБЩИЙ каталог сериалов: сезоны, серии и озвучки всех направлений, а не одной
  темы. Профиль ведёт сериальным направлением и не присваивает себе разделы
  работающих витрин сети.
# Ничего не владеет СОЗНАТЕЛЬНО, и это не упущение.
#
# Правило семейства — `ownership_rule: exactly_one_owner_per_section`
# (blueprints/lords/blueprint.yaml). Все разделы каталога уже заняты:
# catalog_index / movies_index / series_index — у lords-general
# (lordfilm47.space), нишевые — у lords-anime / lords-dorama / lords-animation,
# подборки — у lords-curated, новинки — у lords-new, фасеты — у lords-genre.
# Забрать `series_index` у lords-general значило бы уменьшить индексируемую
# поверхность РАБОТАЮЩЕГО домена — задание это прямо запрещает.
#
# На живую витрину это не влияет: развёрнутый рантайм
# (`automation/host/lords-frontend.py`) про `owns` не знает вовсе — проверено
# 2026-10-06 поиском по файлу, поле встречается только в комментариях.
# Индексируемость страницы решают режим индексации (`indexing_mode`) и запрет
# служебных путей, а не таблица владения. Таблица владения — понятие
# ПЛАНИРОВЩИКА фабрики (`factory/lords/plan.py`) и отчётов по сети.
owns_title_page: false
owns: []

theme:
  name: lords_dark
  tokens:
    bg: "#0e1116"
    surface: "#19202b"
    surface_alt: "#222b38"
    text: "#eef1f5"
    muted: "#9aa6b8"
    accent: "#c8761a"
    accent_text: "#ffffff"
    border: "#2b3542"
    radius: "4px"
    container: "1240px"
    heading_font: "'Open Sans', 'Segoe UI', Roboto, Arial, sans-serif"

layout:
  density: comfortable
  hero: catalog
  card_ratio: "2 / 3"
  columns: { mobile: 2, tablet: 4, desktop: 6 }
  home_blocks: [hero_search, latest_grid, type_rows, top_carousel, top_rated, genre_chips]
  carousel_heading: "Сериалы, которые смотрят сейчас"
  show_calendar: true
  show_collection_cards: false
  facet_position: sidebar

sections:
  home:
    title: "Сериалы онлайн — сезоны, серии и озвучки"
    h1: "Смотреть сериалы онлайн"
    description: "Общий каталог сериалов: что вышло, какие сезоны доступны и где продолжить просмотр."
    intro: >-
      Главная показывает состояние сериального каталога на текущий момент:
      какие серии вышли последними, какие сезоны доступны целиком и куда идти
      дальше — по жанру, по году или через поиск. Это общий каталог, а не
      тематическая витрина: аниме, дорамы и мультсериалы здесь такие же
      сериалы, как остальные, и отдельного предпочтения ни у одного
      направления нет. Ничего, что не подтверждено снимком каталога, на
      главной не появляется.
  search:
    title: "Поиск по каталогу сериалов"
    h1: "Поиск"
    description: "Поиск по названиям сериалов каталога."
    intro: >-
      Поиск ищет оригинальное и русское названия сразу: у сериала их обычно
      два, и зритель помнит то, которое встретил первым. Страница результатов
      служебная и закрыта от индексации: её содержимое зависит от запроса, и
      одинакового адреса с одинаковым содержимым у неё не бывает.
  series_index:
    title: "Сериалы"
    h1: "Сериалы"
    description: "Каталог сериалов с разбивкой по сезонам и сериям."
    intro: >-
      Список сериалов устроен иначе, чем список фильмов: у сериала есть сезоны
      и серии, и раздел ведёт не к одному видео, а к структуре из нескольких
      уровней. Карточка показывает, сколько сезонов вышло и какая серия
      последняя, чтобы выбор не приходилось делать вслепую. Пропущенная серия
      показывается как пропуск — её номер не домысливается.
  new_index:
    title: "Новые серии"
    h1: "Новые серии"
    description: "Серии, вышедшие последними, по дате из снимка каталога."
    intro: >-
      Раздел отвечает на один вопрос: что вышло с прошлого раза. Дата берётся
      из снимка каталога; у записи без даты раздел её не показывает, а не
      ставит сегодняшнюю.
    editorial_rules:
      - Дата выхода серии — только из снимка каталога.
      - Отсутствующая дата показывается как отсутствие.
      - Номер пропущенной серии не восстанавливается по соседним.
