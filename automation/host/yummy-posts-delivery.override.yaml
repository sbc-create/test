# Доставка редакционных НОВОСТЕЙ витрин Yummy: монтирование файла.
#
#   docker compose -p yummyani-staging \
#     --project-directory /home/claude/wt-yummy-mail-org \
#     -f /home/claude/wt-yummy-mail-org/compose.staging.yaml \
#     -f /home/claude/wt-portable-site-cell-01/automation/host/yummy-posts-delivery.override.yaml \
#     --env-file /srv/sites/yummyani-staging/runtime/compose.vars \
#     up -d --no-deps web-org
#
# Зачем наложение, а не правка чужого compose
# -------------------------------------------
#
# Приложение читает новости из `content/editorial-posts.json` ОТ КОРНЯ своего
# процесса и переменной для этого пути не имеет (в отличие от накладок
# описаний, у которых есть `TITLE_OVERLAYS_PATH`). Файл запечён в образ,
# поэтому публикация новости иначе требовала бы пересборки образа.
#
# Монтирование файла снимает это требование целиком: код приложения не
# меняется, образ не пересобирается, а публикация становится доставкой файла —
# тем же способом, которым уже доставляются накладки описаний.
#
# Базовый compose принадлежит проекту приложения и не правится: наложение
# лежит в репозитории фабрики, версионируется с ней и применяется явной
# командой. Так видно, ЧТО именно фабрика добавляет к чужому проекту.
#
# Два условия, без которых монтировать нельзя
# -------------------------------------------
#
# 1. файл доставки обязан СУЩЕСТВОВАТЬ. Монтирование отсутствующего источника
#    заставляет docker создать на его месте КАТАЛОГ, и приложение перестанет
#    разбирать новости вовсе — раздел `/posts` отдал бы ошибку целиком;
# 2. файл обязан быть ЗАСЕЯН содержимым образа. Монтирование заменяет файл
#    образа целиком, и доставка одной новой записи сняла бы с публикации все
#    существующие. Посев делает `factory.qwen.posts.посев`, читая файл из
#    работающего контейнера, и проверяет его схемой приложения.
#
# Монтирование только для чтения: писать в него вправе лишь операция фабрики,
# и приложение не должно иметь такой возможности вовсе.
services:
  web-org:
    volumes:
      - type: bind
        source: /srv/sites/yummyani-staging/runtime/overlays/yummyani.org/editorial-posts.json
        target: /app/content/editorial-posts.json
        read_only: true
