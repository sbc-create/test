# lordfilm077.site — витрина lords-09, общий каталог фильмов.
#
# Только HTTP. Блок 443 ставится отдельным файлом (`lords-09-tls.conf`) ПОСЛЕ
# выпуска сертификата: ссылка на несуществующий сертификат не даст nginx
# перезагрузиться вовсе, и ошибка нового домена уронила бы соседние витрины.
#
# DNS на 2026-10-06 (авторитетный запрос, не локальный hosts):
#   NS   paris.ns.cloudflare.com, piers.ns.cloudflare.com (ttl 21600)
#   A    45.131.182.225 (ttl 300) — публичный адрес этого хоста
# То есть шаг HTTPS у этого домена пройти МОЖЕТ: certbot сумеет подтвердить
# владение. Это отличает lords-09 от lords-06/07, где записи нет.
#
# Порт витрины 9119 (реестр ячеек), upstream cell_lords_09.
#
# Маршрут идёт через upstream `cell_lords_09`, а не прямо на 127.0.0.1:9119:
# это точка, которую переставляет исполнитель при выкладке. Прямой proxy_pass
# означал бы, что переключение трафика проходит успешно и не делает ничего.

# Значение заголовка индексации для этого сайта. Перечень служебных путей и
# режим живут во включаемом файле: менять режим правкой конфигурации значило
# бы править её при каждом переключении. Файл создаёт install-site-nginx.sh —
# закрытым, и дальше им распоряжается только привилегированный исполнитель.
map $uri $cell_robots_lords_09 {
    include /etc/nginx/cells/lords-09.robots;
}

server {
    listen 80;
    listen [::]:80;
    # Без `www`, и это измерено, а не упущено. Авторитетный сервер САМОЙ зоны
    # (paris.ns.cloudflare.com) на 2026-10-06 отвечает по www.lordfilm077.site
    # NXDOMAIN — имени в зоне нет. Объявить его здесь значило бы либо завести
    # имя в сертификат (certbot провалил бы запрос целиком, не выдав
    # сертификата и на apex), либо оставить 443-блок, отвечающий на www
    # непокрывающим сертификатом. У lords-08 www в зоне ЕСТЬ, и там имя
    # объявлено и в server_name, и в aliases реестра.
    server_name lordfilm077.site;

    server_tokens off;

    # Индексация закрыта: в реестре у витрины `desired_state: CLOSED`, а
    # выпуск её не разрешает (`indexing.release_permits_open: false`).
    # Открытие — отдельная операция владельца после публичной проверки.
    add_header X-Robots-Tag $cell_robots_lords_09 always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://cell_lords_09;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://cell_lords_09/healthz;
        access_log off;
    }
}
