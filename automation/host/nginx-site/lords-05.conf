# lordserials22.info — витрина lords-05.
#
# Только HTTP. Блок 443 ставится отдельным файлом ПОСЛЕ выпуска сертификата:
# ссылка на несуществующий сертификат не даст nginx перезагрузиться вовсе, и
# ошибка нового домена уронила бы соседние.
#
# DNS у этого домена настроен и проверен: lordserials22.info и
# www.lordserials22.info разрешаются в 45.131.182.225 — тот же адрес, что у
# работающих витрин. Измерено 2026-09-27 в 19:3x: HTTP отвечает 404 —
# server_name с таким именем нет ни в одной конфигурации, запрос попадает
# в default_server; HTTPS завершается чужим сертификатом (Hostname
# mismatch). Оба признака исчезают ровно с установкой этого файла и
# сертификата.
#
# Маршрут идёт через upstream `cell_lords_05`, а не прямо на 127.0.0.1:9113:
# это точка, которую переставляет исполнитель при выкладке. Прямой proxy_pass
# означал бы, что переключение трафика проходит успешно и не делает ничего.
# Значение заголовка индексации для этого сайта. Перечень служебных
# путей и режим живут во включаемом файле: менять режим правкой
# конфигурации значило бы править её при каждом переключении.
map $uri $cell_robots_lords_05 {
    include /etc/nginx/cells/lords-05.robots;
}

server {
    listen 80;
    listen [::]:80;
    server_name lordserials22.info www.lordserials22.info;

    server_tokens off;

    # Индексация закрыта до решения владельца: витрина ещё не запущена, и
    # открывать её обходу раньше публичной проверки нечем оправдать.
    add_header X-Robots-Tag $cell_robots_lords_05 always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://cell_lords_05;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://cell_lords_05/healthz;
        access_log off;
    }
}
