
# HTTPS добавлен после выпуска сертификата. Отдельным файлом, а не сразу в
# основной конфигурации: блок 443 со ссылкой на несуществующий сертификат не
# даёт nginx перезагрузиться вовсе, то есть роняет и соседние витрины.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zonafilm.cc www.zonafilm.cc;

    ssl_certificate     /etc/letsencrypt/live/zonafilm.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zonafilm.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    # Ограничение индексации сохранено: витрина не запущена публично.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://cell_zona_02;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://cell_zona_02/healthz;
        access_log off;
    }
}
