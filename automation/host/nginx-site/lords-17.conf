# lordserial.net.ru — витрина lords-17, каталог сериалов.
#
# Только HTTP. Блок 443 ставится отдельным файлом (`lords-17-tls.conf`) ПОСЛЕ
# выпуска сертификата: ссылка на несуществующий сертификат не даёт nginx
# перезагрузиться вовсе, и ошибка нового домена уронила бы соседние витрины.
# Измерено 2026-10-13: 443 этого имени отвечает ЧУЖИМ сертификатом (hostname
# mismatch), то есть своего блока у домена пока нет.
#
# DNS на 2026-10-13 (авторитетный запрос к серверу самой зоны, RD=0):
#   NS   lina.ns.cloudflare.com, vin.ns.cloudflare.com
#   A    45.131.182.225 (apex) — публичный адрес этого хоста
#   www  CNAME на apex, тот же адрес; DS у родителя нет (DNSSEC не включён)
# Зона НЕ пересоздавалась: NS совпали с ожидаемыми из задания как есть.
#
# Порт витрины 9135 (реестр ячеек), upstream cell_lords_17.
#
# Маршрут идёт через upstream `cell_lords_17`, а не прямо на 127.0.0.1:9135:
# это точка, которую переставляет исполнитель при выкладке. Прямой proxy_pass
# означал бы, что переключение трафика проходит успешно и не делает ничего.

# Значение заголовка индексации для этого сайта. Перечень служебных путей и
# режим живут во включаемом файле: менять режим правкой конфигурации значило
# бы править её при каждом переключении. Файл создаёт install-site-nginx.sh —
# закрытым, и дальше им распоряжается только привилегированный исполнитель.
map $uri $cell_robots_lords_17 {
    include /etc/nginx/cells/lords-17.robots;
}

server {
    listen 80;
    listen [::]:80;
    server_name lordserial.net.ru;

    server_tokens off;

    # Индексация закрыта: в реестре у витрины `desired_state: CLOSED`, а
    # выпуск её не разрешает (`indexing.release_permits_open: false`).
    # Открытие — отдельная операция владельца после публичной приёмки.
    add_header X-Robots-Tag $cell_robots_lords_17 always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://cell_lords_17;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://cell_lords_17/healthz;
        access_log off;
    }
}

# www — ОТДЕЛЬНЫЙ блок с перенаправлением, а не второе имя рядом с apex.
# Измерено 2026-10-13: имя www.lordserial.net.ru в зоне есть (CNAME на apex). У lords-05
# такое имя стояло в одном блоке с apex и отдавало каталог кодом 200 с
# canonical на сам www-хост — второй сайт с тем же содержимым. Путь ACME
# оставлен и здесь: подтверждение владения именем www нужно сертификату.
server {
    listen 80;
    listen [::]:80;
    server_name www.lordserial.net.ru;

    server_tokens off;
    add_header X-Robots-Tag $cell_robots_lords_17 always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://lordserial.net.ru$request_uri;
    }
}
