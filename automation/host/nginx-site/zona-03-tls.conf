
# zonafilm12.site — HTTPS. Отдельным файлом и ПОСЛЕ выпуска сертификата:
# блок 443 со ссылкой на несуществующий файл не даёт nginx перезагрузиться
# вовсе, то есть роняет и соседние витрины.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zonafilm12.site www.zonafilm12.site;

    ssl_certificate     /etc/letsencrypt/live/zonafilm12.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zonafilm12.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;

    # Индексация закрыта: открытие индексации в это задание не входит.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://cell_zona_03;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://cell_zona_03/healthz;
        access_log off;
    }
}
