# lordserial.spb.ru — HTTPS. Отдельным файлом и ПОСЛЕ выпуска сертификата: блок 443 со
# ссылкой на несуществующий файл не даёт nginx перезагрузиться вовсе, то есть
# роняет и соседние витрины.
#
# Сертификат обязан покрывать ОБА имени (lordserial.spb.ru и www.lordserial.spb.ru): www-блок ниже
# отвечает по HTTPS, и непокрывающий сертификат дал бы на нём ошибку TLS
# вместо перенаправления.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lordserial.spb.ru;

    ssl_certificate     /etc/letsencrypt/live/lordserial.spb.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lordserial.spb.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;

    # Тот же включаемый файл режима, что и у блока 80: два источника режима на
    # один домен расходились бы, и расхождение было бы видно только обходу.
    add_header X-Robots-Tag $cell_robots_lords_15 always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://cell_lords_15;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://cell_lords_15/healthz;
        access_log off;
    }
}

# www по HTTPS — перенаправление на основной адрес, причина та же.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lordserial.spb.ru;

    ssl_certificate     /etc/letsencrypt/live/lordserial.spb.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lordserial.spb.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    add_header X-Robots-Tag $cell_robots_lords_15 always;

    location / {
        return 301 https://lordserial.spb.ru$request_uri;
    }
}
