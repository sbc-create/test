# zonafilm12.site — витрина zona-03.
#
# Только HTTP. Блок 443 ставится отдельным файлом ПОСЛЕ выпуска сертификата:
# ссылка на несуществующий сертификат не даст nginx перезагрузиться вовсе, и
# ошибка нового домена уронила бы соседние.
#
# DNS у этого домена уже настроен и проверен: zonafilm12.site и
# www.zonafilm12.site разрешаются в 45.131.182.225 — тот же адрес, что у
# работающего zonafilm.space. Сейчас домен отвечает 421 (Misdirected Request):
# TLS завершается на нашем сервере чужим сертификатом, а server_name с таким
# именем нет ни в одной конфигурации. То есть остался только этот файл и
# сертификат.
#
# Маршрут идёт через upstream `cell_zona_03`, а не прямо на 127.0.0.1:9123:
# это точка, которую переставляет исполнитель при выкладке. Прямой proxy_pass
# означал бы, что переключение трафика проходит успешно и не делает ничего.
server {
    listen 80;
    listen [::]:80;
    server_name zonafilm12.site www.zonafilm12.site;

    server_tokens off;

    # Индексация закрыта до решения владельца: витрина ещё не запущена, и
    # открывать её обходу раньше публичной проверки нечем оправдать.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://cell_zona_03;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://cell_zona_03/healthz;
        access_log off;
    }
}
