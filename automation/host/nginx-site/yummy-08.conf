# yummyani7.info — витрина yummy-08.
#
# Только HTTP. Блок 443 ставится отдельным файлом ПОСЛЕ выпуска сертификата:
# ссылка на несуществующий сертификат не даст nginx перезагрузиться вовсе, и
# ошибка нового домена уронила бы соседние.
#
# DNS у этого домена на 2026-09-27: A-запись есть: 45.131.182.225.
# Порт витрины 9115 (реестр ячеек), upstream cell_yummy_08.
#
#
# Маршрут идёт через upstream `cell_yummy_08`, а не прямо на 127.0.0.1:9113:
# это точка, которую переставляет исполнитель при выкладке. Прямой proxy_pass
# означал бы, что переключение трафика проходит успешно и не делает ничего.
server {
    listen 80;
    listen [::]:80;
    server_name yummyani7.info www.yummyani7.info;

    server_tokens off;

    # Индексация закрыта до решения владельца: витрина ещё не запущена, и
    # открывать её обходу раньше публичной проверки нечем оправдать.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://cell_yummy_08;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://cell_yummy_08/healthz;
        access_log off;
    }
}
