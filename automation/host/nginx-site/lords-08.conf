# lordserial101.site — витрина lords-08, общий каталог сериалов.
#
# Только HTTP. Блок 443 ставится отдельным файлом (`lords-08-tls.conf`) ПОСЛЕ
# выпуска сертификата: ссылка на несуществующий сертификат не даст nginx
# перезагрузиться вовсе, и ошибка нового домена уронила бы соседние витрины.
#
# DNS на 2026-10-06 (авторитетный запрос, не локальный hosts):
#   NS   paris.ns.cloudflare.com, piers.ns.cloudflare.com (ttl 21600)
#   A    45.131.182.225 (ttl 300) — публичный адрес этого хоста
# То есть шаг HTTPS у этого домена пройти МОЖЕТ: certbot сумеет подтвердить
# владение. Это отличает lords-08 от lords-06/07, где запись отсутствует.
#
# Порт витрины 9118 (реестр ячеек), upstream cell_lords_08.
#
# Маршрут идёт через upstream `cell_lords_08`, а не прямо на 127.0.0.1:9118:
# это точка, которую переставляет исполнитель при выкладке. Прямой proxy_pass
# означал бы, что переключение трафика проходит успешно и не делает ничего.

# Значение заголовка индексации для этого сайта. Перечень служебных путей и
# режим живут во включаемом файле: менять режим правкой конфигурации значило
# бы править её при каждом переключении. Файл создаёт install-site-nginx.sh —
# закрытым, и дальше им распоряжается только привилегированный исполнитель.
map $uri $cell_robots_lords_08 {
    include /etc/nginx/cells/lords-08.robots;
}

server {
    listen 80;
    listen [::]:80;
    server_name lordserial101.site www.lordserial101.site;

    server_tokens off;

    # Индексация закрыта: в реестре у витрины `desired_state: CLOSED`, а
    # выпуск её не разрешает (`indexing.release_permits_open: false`).
    # Открытие — отдельная операция владельца после публичной проверки.
    add_header X-Robots-Tag $cell_robots_lords_08 always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://cell_lords_08;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://cell_lords_08/healthz;
        access_log off;
    }
}
