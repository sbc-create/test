# zonafilm.cc — витрина zona-02.
#
# Только HTTP. TLS появится вместе с записью DNS: ACME без неё невозможен, и
# притворяться нечем — блок 443 со ссылкой на несуществующий сертификат не даст
# nginx перезагрузиться вовсе. Порядок тот же, что был у zonafilm.space:
# сначала эта конфигурация, потом запись A, потом certbot, потом блок 443.
#
# Маршрут идёт через upstream `cell_zona_02`, а не прямо на 127.0.0.1:9123:
# это точка, которую переставляет исполнитель при выкладке. Прямой proxy_pass
# означал бы, что переключение трафика проходит успешно и не делает ничего.
server {
    listen 80;
    listen [::]:80;
    server_name zonafilm.cc www.zonafilm.cc;

    server_tokens off;

    # Индексация закрыта до решения владельца: витрина ещё не запущена, и
    # открывать её обходу раньше публичной проверки нечем оправдать.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://cell_zona_02;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://cell_zona_02/healthz;
        access_log off;
    }
}
