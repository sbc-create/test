# Журнал обхода поисковых роботов: по домену и только роботы.
#
# Зачем он нужен. Вопрос «обходят ли роботы домены-дубли» по общему журналу
# `/var/log/nginx/access.log` не решается: своего `log_format` для него не
# объявлено, то есть действует встроенный `combined`, а в нём НЕТ ни `$host`,
# ни `$server_name` — домена в записи просто нет. Разложить обход по доменам
# оттуда нельзя ни первым полем, ни любым другим (измерено 2026-10-13; прежняя
# команда с `awk '{print $1}'` считала бы IP клиентов и выдавала бы это за счёт
# по доменам).
#
# Префикс `00-` не декоративный: `log_format` допустим только в http-контексте,
# а `access_log`, ссылающийся на ещё не объявленный формат, роняет проверку
# конфигурации целиком. Файл обязан разбираться раньше конфигураций витрин —
# ровно та же причина, что у `00-webmaster-verification-log.conf`.
#
# Почему только роботы. Раздел один на всё, и на 2026-10-15 на нём свободно
# 3,6 %. Полная копия обращений удвоила бы запись журналов ради вопроса, который
# касается роботов; `if=$is_crawler` оставляет в файле лишь их обращения.
# Потолок роста согласован отдельно: `rotate 14`, `compress` уже действуют для
# `/var/log/nginx/*.log` из `/etc/logrotate.d/nginx`, не хватает только
# `maxsize 50M` — см. `docs/OWNER_CRAWL_LOG_20261015.md`.

# Признак робота по User-Agent. Список закрытый и названный: `~*bot` поймал бы
# и браузерные строки вроде «Bot» в названии приложения, а неизвестный обходчик
# в этот журнал и не нужен — вопрос стоит про известные поисковые системы.
map $http_user_agent $is_crawler {
    default                     0;
    "~*YandexBot"               1;
    "~*YandexMobileBot"         1;
    "~*YandexImages"            1;
    "~*Googlebot"               1;
    "~*Googlebot-Image"         1;
    "~*AdsBot-Google"           1;
    "~*bingbot"                 1;
    "~*DuckDuckBot"             1;
    "~*Applebot"                1;
    "~*PetalBot"                1;
    "~*SeznamBot"               1;
    "~*Mail.RU_Bot"             1;
}

# `$host` — то, что прислал клиент в Host; `$server_name` — какой блок запрос
# обработал. Расхождение между ними и есть первое, что нужно увидеть: именно
# так выясняется, что робот пришёл на имя-дубль, а отвечает ему другой сайт.
log_format crawl
    '$time_iso8601 host="$host" server_name="$server_name" status=$status '
    'method=$request_method path="$request_uri" bytes=$body_bytes_sent '
    'rt=$request_time ip=$remote_addr ua="$http_user_agent"';

# Объявление в http-контексте наследуют только блоки БЕЗ собственного
# `access_log`. Таких 35; восемь блоков объявляют свой журнал, и им строка
# дописывается отдельно — перечень и подготовленные файлы в
# `docs/OWNER_CRAWL_LOG_20261015.md`. Без этого неполнота выглядела бы как
# «роботы не ходят».
access_log /var/log/nginx/crawl.log crawl if=$is_crawler;
