# Shared comments module — API and widget assets for animedia.icu.
#
# Install: root copies this to /etc/nginx/snippets/animedia-comments.conf and
# adds one line inside the animedia.icu server block:
#
#     include /etc/nginx/snippets/animedia-comments.conf;
#
# Modelled on /etc/nginx/snippets/yummyani-community-ratings.conf, which is
# the pattern already proven on this host. Adding it to the animedia.icu vhost
# affects that vhost alone: animedia.space has its own file and is not to be
# given this include during Stage 1.
#
# `^~` so this prefix wins over any regex location and comments traffic can
# never fall through to the site runtime.

location ^~ /api/comments/ {
    auth_basic off;

    # A comment is a few kilobytes. The gateway refuses more as well; two
    # limits rather than one because the outer one costs nothing and stops a
    # large body before it reaches Python at all.
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:9150;
    proxy_http_version 1.1;

    # The gateway derives the tenant from this header and from nothing else.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    proxy_connect_timeout 5s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;
    proxy_buffering       off;

    # Comments are never indexable during the owner pilot, and this repeats
    # the site's own header rather than relying on it: a snippet that assumes
    # its neighbour's configuration breaks quietly when the neighbour changes.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}
