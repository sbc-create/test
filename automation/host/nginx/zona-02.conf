# zonafilm.cc — витрина zona-02.
#
# Ставится в /etc/nginx/lords/zona-02.conf. Форма повторяет zona-01.conf, но
# три вещи в ней сделаны иначе, и каждая по причине:
#
# 1. `/healthz` не отдаётся наружу. У zona-01 он проксируется всем; задание
#    требует, чтобы внутренние endpoint не были доступны извне. Проверка
#    здоровья остаётся доступной с петли — там, откуда её и вызывают.
# 2. `www` отвечает редиректом 308 на apex, а не обслуживается как второе имя.
#    Реестр объявляет `www_policy: www_to_apex_308`; два имени, отдающих один и
#    тот же контент, — это два адреса одной страницы.
# 3. Запрос с чужим `Host` получает 444, а не обслуживается. canonical витрины
#    строится из заголовка Host, поэтому неназванное имя, дошедшее до origin,
#    получило бы canonical на себя. `default_server` здесь не объявляется —
#    он уже занят на этом хосте, — но `server_name` перечислен точно, и
#    несовпадение ловится отдельным блоком ниже.
#
# Индексация закрыта на двух уровнях: заголовком отсюда и `noindex, nofollow`
# в разметке и заголовке самого рантайма. Ни один из них не является
# единственным.

# --- HTTP: только ACME и редирект. Контента по 80 нет вовсе. ----------------
server {
    listen 80;
    listen [::]:80;
    server_name zonafilm.cc www.zonafilm.cc;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 308 https://zonafilm.cc$request_uri;
    }
}

# --- HTTPS www → apex ------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.zonafilm.cc;

    ssl_certificate     /etc/letsencrypt/live/zonafilm.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zonafilm.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_zona02:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    return 308 https://zonafilm.cc$request_uri;
}

# --- HTTPS apex: сама витрина ----------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zonafilm.cc;

    ssl_certificate     /etc/letsencrypt/live/zonafilm.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zonafilm.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_zona02:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # Индексация закрыта. `always` обязателен: без него заголовок не попадёт в
    # ответы 4xx/5xx, а закрытой должна быть вся витрина, а не только 200.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # HSTS намеренно не включён, пока витрина не открыта: он запоминается
    # браузером на месяцы и переживёт любой откат этого контура.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # CSP. frame-src открыт для плеера: витрина встраивает его через iframe, и
    # запретить frame-src значило бы выключить просмотр. Список источников
    # плеера сужается владельцем после того, как он назван в контракте
    # поставщика; до этого честнее разрешить https:, чем закрыть просмотр.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-src https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 1m;

    # Обход TEMPLATE_ZONA_BLOCKER-04.
    #
    # Рантайм на оформлении 1.1+ сам делает 308 на адрес без завершающего
    # слэша, собирая Location из РАСКОДИРОВАННОГО пути. На кириллическом адресе
    # `http.server` не может записать такой заголовок в latin-1, обработчик
    # умирает до end_headers(), и клиент получает обрыв соединения вместо
    # ответа. Обрыв хуже 404: мониторинг читает его как падение сервиса.
    #
    # Здесь тот же переход выполняется до проксирования, поэтому до сломанной
    # ветки запрос не доходит. `$uri` у nginx остаётся в закодированном виде,
    # и Location получается корректным для любого алфавита.
    #
    # Это обход, а не исправление: правка нужна в шаблоне (одна строка,
    # tests/unit/test_zona_nonascii_trailing_slash.py). Когда она появится,
    # strict-xfail того теста станет XPASS и напомнит убрать этот блок.
    location ~ ^(/[^.]*[^/])$ {
        return 308 https://zonafilm.cc$1/$is_args$args;
    }

    # Внутренняя проверка здоровья: только с петли.
    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:9123/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:9123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# --- Чужой Host по этому сертификату: соединение закрывается ---------------
# Имя, которого нет в server_name выше, не должно получить ни страницу, ни
# canonical на себя. 444 закрывает соединение без ответа.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^(?!(?:www\.)?zonafilm\.cc$).*\.zonafilm\.cc$;

    ssl_certificate     /etc/letsencrypt/live/zonafilm.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zonafilm.cc/privkey.pem;

    return 444;
}
