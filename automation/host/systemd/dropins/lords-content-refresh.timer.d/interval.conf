[Timer]
# Шаг обязан превышать предел выполнения службы.
#
# Не «длительность цикла», а именно предел: пока прогон не убит по таймауту, он
# может идти. Если шаг меньше предела, таймер попытается запустить новый прогон
# поверх незакончившегося — systemd такой запуск отбросит, но следующего он не
# перепланирует, и обновление снова остановится молча.
#
# Предел службы — 10 часов (см. timeout.conf). Шаг — 11: предел плюс час на то,
# чтобы разобраться с последствиями, если прогон закончился отказом.
#
# Отсчёт идёт от момента, когда служба стала активной (OnUnitActiveSec), а не от
# календаря: иначе следующий запуск приходился бы на середину предыдущего.
#
# Пустое присваивание перед значением обязательно. OnUnitActiveSec — список, а
# не одиночная настройка: без сброса значение из основного unit-файла остаётся
# в силе, и таймер срабатывает и через десять минут, и через одиннадцать часов.
# Проверено на этом хосте: после установки drop-in `systemctl cat` показывал обе
# строки сразу.
OnUnitActiveSec=
OnUnitActiveSec=11h

# Пропущенный из-за перезагрузки запуск выполняется при следующей возможности.
Persistent=true
