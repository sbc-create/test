[Timer]
# Шаг должен превышать длительность цикла.
#
# Цикл занимает около восьми часов (см. timeout.conf службы). При шаге в десять
# минут запуски выстраивались бы в очередь, а свежесть от этого только
# ухудшалась. Девять часов — цикл плюс час на разбор последствий, если прогон
# закончился отказом.
#
# Отсчёт идёт от момента, когда служба стала активной (OnUnitActiveSec), а не
# от календаря: иначе следующий запуск приходился бы на середину предыдущего.
#
# Пустое присваивание перед значением обязательно. OnUnitActiveSec — список, а
# не одиночная настройка: без сброса значение из основного unit-файла остаётся
# в силе, и таймер срабатывает и через десять минут, и через девять часов.
# Проверено на этом хосте: после установки drop-in `systemctl cat` показывал обе
# строки сразу.
OnUnitActiveSec=
OnUnitActiveSec=9h

# Пропущенный из-за перезагрузки запуск выполняется при следующей возможности.
Persistent=true
