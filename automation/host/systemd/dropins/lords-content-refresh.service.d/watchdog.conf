[Service]
# Сторож запускается после каждого прогона, каким бы тот ни кончился.
#
# ExecStopPost выполняется и после успеха, и после отказа, и после прерывания по
# таймауту — то есть именно тогда, когда состояние стоит записать. Сторож
# сверяет таймер и возраст последнего успешного обхода, кладёт вердикт в
# refresh-watchdog-status.json, а тревоги дописывает в
# refresh-watchdog-alerts.jsonl.
#
# Дефис перед командой обязателен: ненулевой код сторожа не должен объявлять
# прогон неудавшимся. Сторож сообщает о состоянии, а не создаёт его, и его
# тревога — не повод считать разложенный релиз испорченным.
#
# НЕ УСТАНОВЛЕН НА ХОСТ ДО ВЫКЛАДКИ ВЕТКИ. Модуля
# factory/lords/refresh_watchdog.py нет в /srv/site-factory/repo: он живёт на
# ветке и в production ещё не выложен. Установленный сейчас, этот файл давал бы
# ModuleNotFoundError, молча проглоченный дефисом, — то есть выглядел бы
# наблюдением, не будучи им. Ставится вместе с выкладкой ветки.
#
# ЧЕГО ЭТОГО НЕ ХВАТИТ И ПОСЛЕ ВЫКЛАДКИ. Главную неисправность — мёртвый таймер
# — так поймать нельзя: если таймер не тикает, служба не запускается, и сторож
# не вызывается тоже. Нужна независимая периодическая проверка: отдельный таймер
# либо вызов `python3 -m factory.lords.refresh_watchdog` из уже существующей.
ExecStopPost=-/srv/site-factory/repo/.venv/bin/python -m factory.lords.refresh_watchdog
