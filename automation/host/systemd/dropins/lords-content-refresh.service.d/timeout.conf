[Service]
# Сколько времени даётся полному обходу и рендеру трёх витрин.
#
# Измерено, а не прикинуто. Полный каталог — 53 116 записей вместо прежних
# 4 800. Рендер ОДНОЙ витрины занял 2 часа 33 минуты: с 13:45:59 до 16:19 UTC
# 30 августа 2026 года, из них около двух с половиной часов сам рендер и
# минуты на раскладку релиза в 1,6 ГБ. Витрин три.
#
# Прежний предел в три часа убивал прогон на второй витрине: первая успевала
# получить полный каталог, две другие оставались на прежних релизах. До этого
# предел в двадцать минут убивал прогон ещё раньше — выборка успевала записать
# кэш, а релизы не раскладывались вовсе.
#
# Восемь часов — это три витрины по два с половиной часа плюс запас на рост
# каталога и на медленный источник. Не «с запасом на всякий случай», а
# измеренная длительность цикла плюс треть.
#
# ВАЖНО: это временное восстановление, а не решение. Полный статический рендер
# 53 116 записей непригоден для оперативного обновления: серия, вышедшая через
# пять минут после начала цикла, доедет до витрины через восемь часов.
# Заменяется инкрементальным механизмом в SITE-ENGINE-02B.
TimeoutStartSec=8h
