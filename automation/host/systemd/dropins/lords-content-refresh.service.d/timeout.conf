[Service]
# Сколько времени даётся полному обходу и рендеру трёх витрин.
#
# Числа измерены на этом хосте, а не прикинуты. Прогон 30 августа 2026 года:
#
#   выборка каталога по трём витринам   11–15 минут
#   рендер и публикация одной витрины   2 часа 22 минуты
#   три витрины                         7 часов 08 минут
#
# Каталог — 53 116 записей вместо прежних 4 800; релиз одной витрины занимает
# около 1,6 ГБ и содержит порядка 61 тысячи страниц.
#
# История пределов, и каждый убивал прогон по-своему:
#
#   20 минут — выборка успевала записать кэш, релизы не раскладывались вовсе;
#   3 часа   — первая витрина получала полный каталог, вторая обрывалась
#              на середине, третья не начиналась;
#   8 часов  — по расчёту укладывалось с запасом в 36 минут, то есть 8% от
#              длительности работы. Замедление на 7% съедало запас целиком, а на
#              хосте параллельно тикают таймеры Yummy и делят четыре ядра.
#
# Десять часов дают запас 2 часа 52 минуты — сорок процентов сверх измеренной
# длительности. Это покрывает и рост каталога, и медленный источник, и
# конкуренцию за процессор.
#
# ВАЖНО: это временное восстановление, а не решение свежести. Полный статический
# рендер 53 116 записей для оперативного обновления непригоден по устройству:
# серия, вышедшая через пять минут после начала цикла, доедет до витрины через
# семь часов. Заменяется инкрементальным или гибридным обновлением в
# SITE-ENGINE-02B — перерисовывать нужно затронутые страницы, а не весь каталог.
TimeoutStartSec=10h
