# MOD-198: запуск из зафиксированного выпуска, а не из изменяемой рабочей копии.
# Класть в /etc/systemd/system/community-ratings-monitor.service.d/release.conf
#
# Выпуск 20261026T143748Z-ec29b2c7fa04: 13 файлов, вне коммита 0, сверка
# «расхождений 0, недостающих импортов 0». Служба системная, User=lords
# (uid 998, входит в группу claude), выпуск читаем: каталоги drwxrwxr-x,
# файлы -rw-rw-r--.
#
# Меняются ДВЕ строки, команда не меняется.
#
# WorkingDirectory обязателен, и это не косметика: ExecStart запускает
# `python3 -c '…'`, а для `-c` первым в sys.path идёт ТЕКУЩИЙ каталог, и
# только потом PYTHONPATH. Если рабочий каталог останется рабочей копией, её
# пакет factory затенит выпуск, и служба продолжит работать на прежнем коде
# при переключённом PYTHONPATH. Проверено своей ошибкой 26.10: запуск из
# чужого каталога дал ModuleNotFoundError на пакете выпуска.
#
# FACTORY_ROOT здесь НЕ задаётся сознательно: factory/paths.py лежит внутри
# выпуска, поэтому repo_root() без переменной уже равен каталогу выпуска —
# миграции 0002/0003/0004 берутся из выпуска. Запасной путь базы
# (PATHS.root/var/ratings/ratings.sqlite) при этом тоже указывает в выпуск,
# и ровно поэтому в блоке стоит проверка ДО: канонический каталог
# /srv/site-factory/repo/var/ratings должен существовать и быть доступен
# lords на запись, иначе служба создаст пустую базу внутри выпуска.
[Service]
WorkingDirectory=/srv/site-factory/services/community-ratings-monitor.service/current
Environment=PYTHONPATH=/srv/site-factory/services/community-ratings-monitor.service/current
