# MOD-198: запуск из зафиксированного выпуска, а не из рабочей копии.
# Класть в /etc/systemd/system/community-ratings-monitor.service.d/release.conf
# Служба системная и работает как User=lords: выпуск читаем всем
# (drwxrwxr-x / -rw-rw-r--), секреты остаются в /etc/site-factory/secrets.
# Проверено 26.10: выпуск 20261026T113854Z-ec29b2c7fa04 (10 файлов, вне коммита 0),
# импорт из выпуска идёт, REPORT_DIR остаётся /srv/site-factory/repo/var/ratings/monitor.
# Команда не меняется — меняются каталог и PYTHONPATH.
[Service]
WorkingDirectory=/srv/site-factory/services/community-ratings-monitor.service/current
Environment=PYTHONPATH=/srv/site-factory/services/community-ratings-monitor.service/current
