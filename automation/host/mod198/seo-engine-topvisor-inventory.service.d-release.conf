# MOD-198: запуск из зафиксированного выпуска, а не из рабочей копии.
# Класть в ~/.config/systemd/user/seo-engine-topvisor-inventory.service.d/release.conf
# Проверено 26.10: выпуск 20261026T114139Z-5f26ed4fbd52 (149 файлов, вне коммита 0),
# свой venv Python 3.11.16, режим status отработал: 17 проектов, source LIVE_READ_ONLY.
# Пустая строка ExecStart= обязательна: без неё к прежней команде добавится вторая.
[Service]
WorkingDirectory=/srv/site-factory/services/seo-engine-topvisor-inventory.service/current
Environment=PYTHONPATH=/srv/site-factory/services/seo-engine-topvisor-inventory.service/current
ExecStart=
ExecStart=/srv/site-factory/services/seo-engine-topvisor-inventory.service/venv/bin/python -m seo_engine.cli seo-inventory-sync --mode now --actor systemd-timer
