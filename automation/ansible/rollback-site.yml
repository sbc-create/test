---
# Откат КОДА на предыдущий релиз: переключение симлинка + health-проверка.
#
# База данных этим playbook'ом НЕ откатывается. Если релиз содержал миграцию,
# оператор восстанавливает БД из бэкапа этого релиза (backup.ref в результате
# задания) и подтверждает восстановление сравнением — см. docs/ROLLBACK.md.
# Предыдущий релиз выбирается по времени изменения каталога; если нужен строго
# «последний известно рабочий», передай его явно через переменную target_release.
- name: Rollback DLE site to previous release
  hosts: "{{ target_host | default(omit) }}"
  gather_facts: true
  vars:
    site_root: "{{ site_root }}"
  tasks:
    - name: Resolve previous release
      when: target_release is not defined
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ site_root }}/releases"
        current=$(basename "$(readlink -f "{{ site_root }}/current")")
        ls -1t | grep -v "^${current}$" | head -1
      args:
        executable: /bin/bash
      register: previous_release
      changed_when: false

    - name: Fail when there is nothing to roll back to
      ansible.builtin.assert:
        that: previous_release.stdout | trim | length > 0
        fail_msg: "Предыдущий рабочий релиз отсутствует — откат невозможен"

    - name: Warn when rolling back to a database-backed release
      ansible.builtin.debug:
        msg: >-
          Релиз содержит БД ({{ database_engine }}). Откат кода не откатывает данные:
          восстанови БД из бэкапа этого релиза и подтверди сравнением.
      when: database_engine | default('none') != 'none'

    - name: Switch current to previous release
      ansible.builtin.file:
        src: "{{ site_root }}/releases/{{ target_release | default(previous_release.stdout | trim) }}"
        dest: "{{ site_root }}/current"
        state: link
        force: true

    - name: Health check after rollback
      ansible.builtin.uri:
        url: "http://127.0.0.1/"
        status_code: [200]
        headers:
          Host: "{{ domain | default(omit) }}"
      changed_when: false
