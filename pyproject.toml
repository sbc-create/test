[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-operator"
version = "0.1.0"
description = "Автономный SEO-оператор и главный редактор для портфеля сайтов"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
seo = "seo_operator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".claude/hooks"]
addopts = "-q"
