schema_version: 1
targets:
  # Единственная цель, доступная в этой сессии: одноразовое локальное окружение для пилота.
  - ref: local-disposable
    adapter: local_disposable
    environments: [staging]
    root: var/targets/local-disposable
    bind_host: 127.0.0.1
    port_range: [8081, 8099]
    web_server: php_builtin
    database: none                  # DLE не устанавливается: дистрибутив не передан
    purpose: "пилот и автотесты SEO/QA-контура на реальном HTTP без внешней сети"
    production_capable: false
  # Стенд второго blueprint: одно Next-приложение обслуживает три сайта.
  - ref: payload-local
    adapter: payload_multisite
    environments: [staging]
    root: var/targets/payload-local
    bind_host: 127.0.0.1
    port_range: [8110, 8129]
    web_server: next_start
    database: postgres
    purpose: "стенд трёх аниме-сайтов на общей CMS: сборка, применение тенанта, откат"
    production_capable: false
  # Публичный fixture-staging направления Lords на управляющем сервере.
  # Адаптер не ssh_ansible: агент к серверу не подключается и подключаться не
  # должен. Фабрика готовит пакет и идемпотентный сценарий, применяет его
  # оператор на самом хосте. Поэтому здесь нет ssh_host_ref — выдумывать
  # пользователя развёртывания, ключ и запись host key ради красивой записи в
  # inventory нельзя, а без них ssh_ansible был бы неработающим обещанием.
  - ref: lords-staging-control-01
    adapter: operator_applied
    environments: [staging]
    root: /srv/lords
    bind_host: 127.0.0.1
    port_range: [9101, 9109]
    web_server: nginx
    database: none                  # каталог стенда синтетический, БД не нужна
    origin_ipv4: 45.131.182.225
    apply_script: automation/host/lords-staging-apply.sh
    purpose: "три публичных fixture-staging сайта Lords под Basic Auth и noindex"
    production_capable: false
