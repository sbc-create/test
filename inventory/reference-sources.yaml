    url: https://amd.online/
    kind: ui_reference
    provenance: "Change Request v2.0 от 22.08.2026, раздел 3"
    read_only: true
    purpose: "измерение информационной архитектуры, плотности и поведения интерфейса"
    allowed_paths:
      - /
    viewports: [390, 768, 1024, 1440, 1920]
    store:
      measurements: true
      screenshots: true
      page_text: false
      images: false
      identifiers: false
