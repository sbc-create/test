# Источники, которые разрешено открывать в режиме read-only ТОЛЬКО для измерения
# интерфейса. Список не расширяется по инициативе агента: каждая запись приходит
# из задания владельца проекта.
#
# Разрешено: измерять ширины, отступы, типографику, пропорции карточек, порядок
# секций, поведение шапки и плеера; сохранять собственные измерения и скриншоты.
# Запрещено: сохранять тексты, изображения, комментарии, каталог, рекламные и
# publisher ID, использовать увиденные значения как конфигурацию наших сайтов.
