schema_version: 1
# Пусто: SSH-хостов не передано (F1.2). Формат записи — ниже, в закомментированном примере.
hosts:
  - ref: k2-zomro-01
    hostname: 145.63.129.86
    port: 22
    deploy_user: k2deploy
    auth: publickey_only
    ssh_key_secret_ref: file:/home/claude/.ssh/k2deploy-zomro-01
    known_hosts_entry_ref: inventory/known_hosts.d/k2-zomro-01
    strict_host_key_checking: yes
    # Фактический список измерен 2026-10-17 (`sudo -n -l` от k2deploy на
    # узле). Пустой список здесь означал бы «sudo нет вовсе» — и из-за этого
    # расхождения выпуск кода витрин считался невозможным, хотя перезапуск
    # службы разрешён, а сам сценарий выпуска — нет.
    sudo_allowlist:
      - "/usr/sbin/nginx -t"
      - "/usr/bin/systemctl reload nginx"
      - "/usr/bin/systemctl restart nova-lordfilm-group.service"
      - "/usr/bin/systemctl restart nova-lordfilm-msk-ru.service"
      - "/usr/bin/systemctl restart nova-lordfilm-spb-ru.service"
      - "/usr/bin/systemctl restart nova-lordserial-group.service"
      - "/usr/bin/systemctl restart nova-lordserial-msk-ru.service"
      - "/usr/bin/systemctl restart nova-lordserial-net-ru.service"
      - "/usr/bin/systemctl restart nova-lordserial-spb-ru.service"
      - "/usr/bin/systemctl restart nova-lordserial-su.service"
    environments: [staging]
