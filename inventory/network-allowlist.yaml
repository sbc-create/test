# Хосты интеграций, к которым профиль UNATTENDED_SAFE разрешает обычные запросы
# без подтверждения оператора.
#
# Каждая строка приходит из задания владельца. Расширять список по инициативе
# агента запрещено: отсутствие записи означает BLOCKED_INPUT, а не «разрешено всё».
schema_version: 1
hosts:
  # --- Яндекс.Метрика и Яндекс.Вебмастер -----------------------------------
  # Внесены заданием «полная автоматизация Яндекс.Метрики и Вебмастера»
  # (2026-08-23). Владелец разрешил реальные внешние записи ровно для трёх
  # счётчиков YummyAnime и их целей; всё остальное остаётся read-only или в
  # режиме плана. Токен передаётся только заголовком Authorization и берётся из
  # файла секрета вне репозитория.
  - ref: yandex-metrika-api
    host: api-metrika.yandex.net
    purpose: "Метрика: Management API (счётчики, цели) и Reporting API (read-only отчёты)"
    methods: [GET, POST]
    token_secret_ref: file:/etc/site-factory/secrets/yandex_oauth_token
    contract_ref: knowledge/YANDEX_ANALYTICS_CONTRACT.yaml
  - ref: yandex-webmaster-api
    host: api.webmaster.yandex.net
    purpose: "Вебмастер: список сайтов, маркер подтверждения, read-only отчёты индексации"
    methods: [GET, POST]
    token_secret_ref: file:/etc/site-factory/secrets/yandex_oauth_token
    contract_ref: knowledge/YANDEX_ANALYTICS_CONTRACT.yaml

  # --- официальная документация (только чтение) ----------------------------
  # Нужна затем, чтобы контракт в knowledge/ обновлялся по первоисточнику, а не
  # по пересказам. Записи сюда не идут: у документации нет ни токена, ни POST.
  - ref: yandex-dev-docs-ru
    host: yandex.ru
    purpose: "официальная документация API Метрики и Вебмастера (yandex.ru/dev/...)"
    methods: [GET]
  - ref: yandex-dev-docs-com
    host: yandex.com
    purpose: "официальная документация API Метрики и Вебмастера (yandex.com/dev/...)"
    methods: [GET]

  # --- CDNVideoHub: проверка живости credentials --------------------------
  # Внесён заданием «центральный Secret Hub для всех направлений» (2026-08-25).
  # Владелец прямо потребовал проверять credentials живым read-only запросом
  # перед сохранением; без записи здесь требование неисполнимо.
  #
  # Запись максимально узкая: один хост, только GET. Адрес и путь взяты из уже
  # работающего клиента на этом же хосте
  # (/srv/sites/yummyani-staging/repo/src/modules/catalog/infrastructure/
  #  cdnvideohub/constants.ts), а не подобраны — провенанс записан в
  # config/secret-hub.json и в D87.
  #
  # Это НЕ контракт синхронизации каталога: knowledge/cdnvideohub/content-api.yaml
  # остаётся not_provided и меняется только через skill /research-freeze по
  # официальному документу провайдера.
  - ref: cdnvideohub-public-api
    host: public-api.cdnvideohub.com
    purpose: "Secret Hub: read-only проверка выданного API Token перед сохранением"
    methods: [GET]
    token_secret_ref: hub:/var/lib/site-factory-secret-hub/store.sqlite3
    contract_ref: knowledge/cdnvideohub/PLAYER_CONTRACT.yaml

  # --- собственные публичные витрины: только приёмка --------------------------
  # Внесены заданием TEMPLATES-YUMMY-EPISODES-LIVE-DEPLOY-013: без записи живая
  # проверка выкаченного релиза неисполнима — guard отклоняет запрос к домену,
  # которого нет в этом файле, и приёмка остаётся словом вместо измерения.
  #
  # Это не расширение периметра интеграций: перечислены ровно пять уже
  # работающих собственных доменов, и только читающие методы. Ни один из них не
  # принимает от фабрики форм, credentials и записи. Значение каждого host взято
  # из совпадения двух независимых источников на этом же хосте — nginx
  # `server_name` (/etc/nginx/sites-available/<domain>.conf, для animedia —
  # Description юнита) и `domains[]` в config/site-profiles/<site_id>.json;
  # для Yummy третьим совпадением служит YUMMY_VARIANT_DOMAIN в ExecStart юнита.
  # Wildcard намеренно нет: он разрешил бы поддомен, которого никто не проверял.
  - ref: yummyani-site-public
    host: yummyani.site
    purpose: "приёмка выкаченного релиза: episode selector, footer, contacts, индексация"
    methods: [GET, HEAD]
  - ref: yummyani-org-public
    host: yummyani.org
    purpose: "приёмка выкаченного релиза: episode selector, footer, contacts"
    methods: [GET, HEAD]
  - ref: yummyani-biz-public
    host: yummyani.biz
    purpose: "приёмка выкаченного релиза: episode selector, footer, contacts"
    methods: [GET, HEAD]
  - ref: animedia-icu-public
    host: animedia.icu
    purpose: "приёмка выкаченного релиза: footer и contact-блок"
    methods: [GET, HEAD]
  - ref: animedia-space-public
    host: animedia.space
    purpose: "приёмка выкаченного релиза: footer и contact-блок"
    methods: [GET, HEAD]
  # Внесён заданием TEMPLATE-ZONA-INPUT-MEASURE-02 (OWNER_AUTHORIZATION=
  # EXACT_INVENTORY_GET_HEAD_AND_READ_ONLY_MEASUREMENT). Приёмка
  # TEMPLATE-POSTDEPLOY-ACCEPTANCE-01 остановилась на BLOCKED_INPUT именно здесь:
  # витрина выложена и обслуживается, но без записи guard отклоняет запрос, и
  # третья витрина остаётся неизмеренной. Значение host взято из совпадения двух
  # независимых источников на этом же хосте: nginx `server_name` в
  # /etc/nginx/lords/zona-01.conf и `canonical_domain` витрины zona-01 в
  # /srv/lords/.frontend/indexing-policy.json. Методы — только читающие: витрина
  # не принимает от фабрики ни форм, ни credentials, ни записи.
  #
  # nginx отвечает и на www.zonafilm.space, но это имя намеренно не внесено:
  # задание разрешило ровно одно имя, а alias никто не измерял.
  - ref: zonafilm-space-public
    host: zonafilm.space
    purpose: "приёмка выкаченного релиза: baseline витрины Zona"
    methods: [GET, HEAD]

  # --- референсы визуального сравнения --------------------------------------
  # Названы владельцем в задании YUMMY/ANIMEDIA/ZONA как «подтверждённые
  # референсы». Без них сравнение с оригиналом неисполнимо, и остаётся только
  # честный UNVERIFIED — процент сходства без парных скриншотов был бы
  # выдуманным числом.
  #
  # Только чтение и только эти два имени: витрины сравниваются по снятым
  # страницам, ничего туда не отправляется.
  - ref: animedia-reference
    host: amd.online
    purpose: "референс оформления Animedia: парные скриншоты для сравнения"
    methods: [GET, HEAD]
  - ref: zona-reference
    host: w140.zona.plus
    purpose: "референс оформления Zona: парные скриншоты для сравнения"
    methods: [GET, HEAD]
