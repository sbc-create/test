  - ref: wikipedia-ru
    host: ru.wikipedia.org
    purpose: "статья о фильме/сериале: идентичность по IMDb ID, дополнительный источник сюжета"
    methods: [GET]
    contract_ref: config/editorial-sources.json#src-wikipedia
