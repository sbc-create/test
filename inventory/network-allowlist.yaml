# Хосты интеграций, к которым профиль UNATTENDED_SAFE разрешает обычные запросы
# без подтверждения оператора.
#
# Каждая строка приходит из задания владельца. Расширять список по инициативе
# агента запрещено: отсутствие записи означает BLOCKED_INPUT, а не «разрешено всё».
schema_version: 1
hosts:
  # --- Яндекс.Метрика и Яндекс.Вебмастер -----------------------------------
  # Внесены заданием «полная автоматизация Яндекс.Метрики и Вебмастера»
  # (2026-08-23). Владелец разрешил реальные внешние записи ровно для трёх
  # счётчиков YummyAnime и их целей; всё остальное остаётся read-only или в
  # режиме плана. Токен передаётся только заголовком Authorization и берётся из
  # файла секрета вне репозитория.
  - ref: yandex-metrika-api
    host: api-metrika.yandex.net
    purpose: "Метрика: Management API (счётчики, цели) и Reporting API (read-only отчёты)"
    methods: [GET, POST]
    token_secret_ref: file:/etc/site-factory/secrets/yandex_oauth_token
    contract_ref: knowledge/YANDEX_ANALYTICS_CONTRACT.yaml
  - ref: yandex-webmaster-api
    host: api.webmaster.yandex.net
    purpose: "Вебмастер: список сайтов, маркер подтверждения, read-only отчёты индексации"
    methods: [GET, POST]
    token_secret_ref: file:/etc/site-factory/secrets/yandex_oauth_token
    contract_ref: knowledge/YANDEX_ANALYTICS_CONTRACT.yaml

  # --- официальная документация (только чтение) ----------------------------
  # Нужна затем, чтобы контракт в knowledge/ обновлялся по первоисточнику, а не
  # по пересказам. Записи сюда не идут: у документации нет ни токена, ни POST.
  - ref: yandex-dev-docs-ru
    host: yandex.ru
    purpose: "официальная документация API Метрики и Вебмастера (yandex.ru/dev/...)"
    methods: [GET]
  - ref: yandex-dev-docs-com
    host: yandex.com
    purpose: "официальная документация API Метрики и Вебмастера (yandex.com/dev/...)"
    methods: [GET]

  # --- CDNVideoHub: проверка живости credentials --------------------------
  # Внесён заданием «центральный Secret Hub для всех направлений» (2026-08-25).
  # Владелец прямо потребовал проверять credentials живым read-only запросом
  # перед сохранением; без записи здесь требование неисполнимо.
  #
  # Запись максимально узкая: один хост, только GET. Адрес и путь взяты из уже
  # работающего клиента на этом же хосте
  # (/srv/sites/yummyani-staging/repo/src/modules/catalog/infrastructure/
  #  cdnvideohub/constants.ts), а не подобраны — провенанс записан в
  # config/secret-hub.json и в D87.
  #
  # Это НЕ контракт синхронизации каталога: knowledge/cdnvideohub/content-api.yaml
  # остаётся not_provided и меняется только через skill /research-freeze по
  # официальному документу провайдера.
  - ref: cdnvideohub-public-api
    host: public-api.cdnvideohub.com
    purpose: "Secret Hub: read-only проверка выданного API Token перед сохранением"
    methods: [GET]
    token_secret_ref: hub:/var/lib/site-factory-secret-hub/store.sqlite3
    contract_ref: knowledge/cdnvideohub/PLAYER_CONTRACT.yaml

  # --- десять витрин задания «довести до работающего публичного состояния» ---
  # Внесены заданием владельца от 2026-09-27 (десять доменов перечислены в самом
  # задании поимённо). Разрешён только GET: приёмка публичного результата —
  # чтение страницы, build-id, счётчика Метрики и метатегов. Ни одна запись не
  # несёт токена, потому что витрины публичные и авторизации не требуют.
  #
  # Три домена Animego различаются символами и являются РАЗНЫМИ сайтами:
  # an1mego (цифра 1 + буква o), animeg0 (буква i + цифра 0), an1meg0 (обе цифры).
  # Строки ниже приведены ровно в том написании, что в задании.
  - ref: site-an1mego
    host: an1mego.site
    purpose: "публичная приёмка витрины: HTTPS, build-id, каталог, счётчик"
    methods: [GET]
  - ref: site-animeg0
    host: animeg0.site
    purpose: "публичная приёмка витрины: HTTPS, build-id, каталог, счётчик"
    methods: [GET]
  - ref: site-an1meg0
    host: an1meg0.site
    purpose: "публичная приёмка витрины: HTTPS, build-id, каталог, счётчик"
    methods: [GET]
  - ref: site-zonafilm-cc
    host: zonafilm.cc
    purpose: "публичная приёмка витрины: HTTPS, build-id, каталог, счётчик"
    methods: [GET]
  - ref: site-zonafilm12
    host: zonafilm12.site
    purpose: "публичная приёмка витрины: HTTPS, build-id, каталог, счётчик"
    methods: [GET]
  - ref: site-yummyani7-site
    host: yummyani7.site
    purpose: "публичная приёмка витрины: HTTPS, build-id, каталог, счётчик"
    methods: [GET]
  - ref: site-yummyani7-info
    host: yummyani7.info
    purpose: "публичная приёмка витрины: HTTPS, build-id, каталог, счётчик"
    methods: [GET]
  - ref: site-lordserials22-site
    host: lordserials22.site
    purpose: "публичная приёмка витрины: HTTPS, build-id, каталог, счётчик"
    methods: [GET]
  - ref: site-lordserials22-space
    host: lordserials22.space
    purpose: "публичная приёмка витрины: HTTPS, build-id, каталог, счётчик"
    methods: [GET]
  - ref: site-lordserials22-info
    host: lordserials22.info
    purpose: "публичная приёмка витрины: HTTPS, build-id, каталог, счётчик"
    methods: [GET]

  # --- плейлист плеера CDNVideoHub (только чтение) --------------------------
  # Внесён заданием «восстановить воспроизведение на zonafilm12.site» от
  # 2026-09-28: оно прямо требует проследить цепочку «источник → ... →
  # фактическое воспроизведение» и сравнить данные источника с тем, что
  # получает посетитель. Без обращения к плейлисту это неисполнимо.
  #
  # Это ТОТ ЖЕ адрес, который открывает браузер посетителя, и запрос тот же:
  # publisher витрины (он публичен — стоит в разметке каждой карточки), номер
  # записи и агрегатор. Ни токена, ни заголовка авторизации здесь нет и быть не
  # может, поэтому строка не несёт secret_ref. Только GET.
  - ref: cdnvideohub-player-playlist
    host: plapi.cdnvideohub.com
    purpose: "плейлист плеера: сверка доступных серий и озвучек с тем, что видит посетитель"
    methods: [GET]
    contract_ref: knowledge/cdnvideohub/PLAYER_CONTRACT.yaml

  # --- остальные выложенные витрины: общий дефект воспроизведения -----------
  # Внесены заданием владельца от 2026-09-28 «устранить повторяющуюся ошибку
  # воспроизведения на ВСЕХ выложенных сайтах». Задание поимённо называет
  # lordserial33.biz и прямо требует взять перечень витрин из действующего
  # реестра (config/site-cells.json) и проверить КАЖДУЮ: «HTTP 200, iframe и
  # зелёные тесты отдельно не доказывают работу видео».
  #
  # Ни одной записи нет вне реестра ячеек: список получен из него, а не собран
  # агентом. Только GET — приёмка публичного результата и запрос плейлиста с
  # заголовком Origin витрины, как это делает браузер посетителя. Токенов нет:
  # витрины публичны, плейлист авторизации не требует.
  - ref: site-lordserial33-biz
    host: lordserial33.biz
    purpose: "публичная приёмка витрины и воспроизведение: страница серии, build-id, плеер"
    methods: [GET]
  - ref: site-lordfilm47-space
    host: lordfilm47.space
    purpose: "публичная приёмка витрины и воспроизведение: страница серии, build-id, плеер"
    methods: [GET]
  - ref: site-1lordserials1-online
    host: 1lordserials1.online
    purpose: "публичная приёмка витрины и воспроизведение: страница серии, build-id, плеер"
    methods: [GET]
  - ref: site-zonafilm-space
    host: zonafilm.space
    purpose: "публичная приёмка витрины и воспроизведение: страница серии, build-id, плеер"
    methods: [GET]
  - ref: site-animedia-icu
    host: animedia.icu
    purpose: "публичная приёмка витрины и воспроизведение: страница серии, build-id, плеер"
    methods: [GET]
  - ref: site-animedia-space
    host: animedia.space
    purpose: "публичная приёмка витрины и воспроизведение: страница серии, build-id, плеер"
    methods: [GET]
  - ref: site-yummyani-org
    host: yummyani.org
    purpose: "публичная приёмка витрины и воспроизведение: страница серии, build-id, плеер"
    methods: [GET]
  - ref: site-yummyani-site
    host: yummyani.site
    purpose: "публичная приёмка витрины и воспроизведение: страница серии, build-id, плеер"
    methods: [GET]
  - ref: site-yummyani-biz
    host: yummyani.biz
    purpose: "публичная приёмка витрины и воспроизведение: страница серии, build-id, плеер"
    methods: [GET]

  # --- два новых сайта семейства Lords -------------------------------------
  # Внесены заданием владельца от 2026-10-05/06: «Разрешаю ... создание двух
  # новых сайтов: lordserial101.site — направление сериалов, семейство Lords;
  # lordfilm077.site — направление фильмов, семейство Lords», и оно же требует
  # проверить публичный результат в браузере. Домены названы владельцем
  # поимённо — список не расширен по инициативе агента.
  #
  # DNS проверен до внесения: оба делегированы на Cloudflare
  # (piers/paris.ns.cloudflare.com) и A-записью указывают на 45.131.182.225 —
  # адрес, принадлежащий этому хосту (проверено bind()). Только GET: приёмка
  # публичного результата и запрос плейлиста с Origin витрины, как это делает
  # браузер посетителя.
  - ref: site-lordserial101-site
    host: lordserial101.site
    purpose: "публичная приёмка новой витрины и воспроизведение: главная, каталог, карточка, плеер"
    methods: [GET]
  - ref: site-lordfilm077-site
    host: lordfilm077.site
    purpose: "публичная приёмка новой витрины и воспроизведение: главная, каталог, карточка, плеер"
    methods: [GET]

  # --- редакционные источники фактов (решение владельца 2026-10-08, D199) ---
  # Только чтение и только по ID, уже сопоставленному в каталоге сети; описания
  # не копируются. Официальные сайты произведений сюда НЕ вносятся списком:
  # адрес берётся из external_links Shikimori для того же ID, и его читает
  # automation/local/source_fetch.py, проверяя это происхождение.
  - ref: shikimori-api
    # shikimori.one отвечает 301 на shikimori.io (проверено 2026-10-08); API живёт там.
    host: shikimori.io
    purpose: "Shikimori API: идентичность тайтла, факты завязки, официальные ссылки (external_links)"
    methods: [GET]
    contract_ref: config/editorial-sources.json#src-shikimori
  # Jikan (api.jikan.moe) и MyAnimeList сюда НЕ внесены: Jikan с этого хоста
  # недоступен (таймаут соединения 2026-10-08), а robots.txt MAL запрещает
  # ИИ-агентам весь сайт (D199). Неиспользуемый канал не открывается.

  # --- доставка отчётов владельцу (поручение владельца 2026-10-08) ----------
  # Только Bot API: getUpdates (поиск чата владельца), sendMessage,
  # sendDocument. Токен — файл root:0600 вне репозитория, в службу приходит
  # через LoadCredential; сессии агента он не выдаётся и в журналы не пишется.
  - ref: telegram-bot-api
    host: api.telegram.org
    purpose: "доставка SEO-отчётов и срочных ошибок владельцу в Telegram"
    methods: [GET, POST]
    token_secret_ref: file:/etc/site-factory/secrets/telegram/bot_token
    contract_ref: docs/REPORT_DELIVERY.md

