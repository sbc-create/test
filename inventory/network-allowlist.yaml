# Хосты интеграций, к которым профиль UNATTENDED_SAFE разрешает обычные запросы
# без подтверждения оператора.
#
# Каждая строка приходит из задания владельца. Расширять список по инициативе
# агента запрещено: отсутствие записи означает BLOCKED_INPUT, а не «разрешено всё».
schema_version: 1
hosts:
  # --- Яндекс.Метрика и Яндекс.Вебмастер -----------------------------------
  # Внесены заданием «полная автоматизация Яндекс.Метрики и Вебмастера»
  # (2026-08-23). Владелец разрешил реальные внешние записи ровно для трёх
  # счётчиков YummyAnime и их целей; всё остальное остаётся read-only или в
  # режиме плана. Токен передаётся только заголовком Authorization и берётся из
  # файла секрета вне репозитория.
  - ref: yandex-metrika-api
    host: api-metrika.yandex.net
    purpose: "Метрика: Management API (счётчики, цели) и Reporting API (read-only отчёты)"
    methods: [GET, POST]
    token_secret_ref: file:/etc/site-factory/secrets/yandex_oauth_token
    contract_ref: knowledge/YANDEX_ANALYTICS_CONTRACT.yaml
  - ref: yandex-webmaster-api
    host: api.webmaster.yandex.net
    purpose: "Вебмастер: список сайтов, маркер подтверждения, read-only отчёты индексации"
    methods: [GET, POST]
    token_secret_ref: file:/etc/site-factory/secrets/yandex_oauth_token
    contract_ref: knowledge/YANDEX_ANALYTICS_CONTRACT.yaml

  # --- официальная документация (только чтение) ----------------------------
  # Нужна затем, чтобы контракт в knowledge/ обновлялся по первоисточнику, а не
  # по пересказам. Записи сюда не идут: у документации нет ни токена, ни POST.
  - ref: yandex-dev-docs-ru
    host: yandex.ru
    purpose: "официальная документация API Метрики и Вебмастера (yandex.ru/dev/...)"
    methods: [GET]
  - ref: yandex-dev-docs-com
    host: yandex.com
    purpose: "официальная документация API Метрики и Вебмастера (yandex.com/dev/...)"
    methods: [GET]

  # --- CDNVideoHub: проверка живости credentials --------------------------
  # Внесён заданием «центральный Secret Hub для всех направлений» (2026-08-25).
  # Владелец прямо потребовал проверять credentials живым read-only запросом
  # перед сохранением; без записи здесь требование неисполнимо.
  #
  # Запись максимально узкая: один хост, только GET. Адрес и путь взяты из уже
  # работающего клиента на этом же хосте
  # (/srv/sites/yummyani-staging/repo/src/modules/catalog/infrastructure/
  #  cdnvideohub/constants.ts), а не подобраны — провенанс записан в
  # config/secret-hub.json и в D87.
  #
  # Это НЕ контракт синхронизации каталога: knowledge/cdnvideohub/content-api.yaml
  # остаётся not_provided и меняется только через skill /research-freeze по
  # официальному документу провайдера.
  - ref: cdnvideohub-public-api
    host: public-api.cdnvideohub.com
    purpose: "Secret Hub: read-only проверка выданного API Token перед сохранением"
    methods: [GET]
    token_secret_ref: hub:/var/lib/site-factory-secret-hub/store.sqlite3
    contract_ref: knowledge/cdnvideohub/PLAYER_CONTRACT.yaml

  # --- food-baking: аудит референсов и факты рецептов (только чтение) ---------
  # Внесены заданием владельца PRACTICAL-NETWORK-NIGHT-CONTINUE-02 (2026-10-12):
  # King Arthur и Sally's названы в задании как стартовые референсы выпечки;
  # eda.rambler.ru — русский профильный референс из исходного аудита
  # TEMPLATE-FOOD-DAILY-01. Только GET, 1 запрос на хост.
  - ref: food-baking-kingarthur
    host: www.kingarthurbaking.com
    purpose: "food-baking: референс UX (только аудит)"
    methods: [GET]
    provenance: PRACTICAL-NETWORK-NIGHT-CONTINUE-02 (2026-10-12)
  - ref: food-baking-sallys
    host: sallysbakingaddiction.com
    purpose: "food-baking: референс UX (только аудит)"
    methods: [GET]
    provenance: PRACTICAL-NETWORK-NIGHT-CONTINUE-02 (2026-10-12)
  - ref: food-baking-eda-rambler
    host: eda.rambler.ru
    purpose: "food-baking: русский референс и источник фактов рецептов выпечки"
    methods: [GET]
    provenance: PRACTICAL-NETWORK-NIGHT-CONTINUE-02 (2026-10-12)
