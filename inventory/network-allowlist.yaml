  # --- конкурентное исследование: пять референсов задания 2026-10-22 --------
  # Внесены заданием владельца «организуй самостоятельное, исследовательское и
  # параллельное развитие всех наших сайтов» от 2026-10-22, §3: там эти пять
  # адресов перечислены поимённо как начальные референсы, а §3–§4 прямо требуют
  # сопоставить охват, структуру, тексты, разметку и внешние ссылки.
  #
  # Только GET. Токенов нет и быть не может: сайты публичные.
  #
  # ЧТО РАЗРЕШЕНО ХРАНИТЬ, и это сужение, а не формальность. Закрытый мир
  # запрещает не чтение, а ИМПОРТ: придуманные и чужие данные на наших сайтах.
  # Поэтому из этих источников сохраняются только СТРУКТУРНЫЕ факты и
  # измерения — наличие и адреса типов страниц, число элементов, значения
  # title/description/canonical/robots, состав sitemap, признаки разметки,
  # измерения интерфейса. Тексты, изображения, каталог, комментарии,
  # рекламные и publisher ID не сохраняются и ни в каком виде не попадают на
  # наши сайты и в наши материалы. Правило то же, что у
  # inventory/reference-sources.yaml, и оно сильнее удобства.
  - ref: competitor-yummyani-me
