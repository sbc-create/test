    methods: [GET]
    contract_ref: config/editorial-sources.json#src-wikipedia
  - ref: wikidata
    host: www.wikidata.org
    purpose: "страница элемента: официальный сайт (P856), IMDb (P345), Кинопоиск (P2603)"
    methods: [GET]
    contract_ref: config/editorial-sources.json#src-wikidata
  # Jikan (api.jikan.moe) и MyAnimeList сюда НЕ внесены: Jikan с этого хоста
