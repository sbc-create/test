acceptance:
  routes:
  - path: /
    page_type: home
    expected_status: 200
    expect_indexable: true
  - path: /collections/
    page_type: category
    expected_status: 200
    expect_indexable: true
  - path: /news/
    page_type: news_index
    expected_status: 200
    expect_indexable: true
  - path: /catalog/
    page_type: category
    expected_status: 200
    expect_indexable: false
  - path: /search/
    page_type: search
    expected_status: 200
    expect_indexable: false
  - path: /nothing-here/
    page_type: not_found
    expected_status: 404
    expect_indexable: false
  scenarios:
  - id: editor-publishes-title
    description: Редактор создаёт публикацию тайтла в CMS и она появляется на своём
      домене
    steps:
    - Войти в админку под редактором сайта
    - Создать публикацию тайтла с собственным вступлением
    - Опубликовать и открыть страницу на домене этого сайта
    - Убедиться, что на других доменах публикации нет
  - id: tenant-isolation
    description: Пользователь одного сайта не видит и не меняет данные другого
    steps:
    - Открыть список материалов под администратором сайта
    - Убедиться, что видны только материалы своего сайта
    - Попытаться открыть документ другого сайта по прямому идентификатору
    - Убедиться в отказе
  - id: comment-moderation
    description: Комментарий проходит модерацию и только после неё появляется на сайте
    steps:
    - Отправить комментарий с публичной страницы
    - Убедиться, что на странице его нет
    - Опубликовать комментарий под модератором
    - Убедиться, что он появился только на своём сайте
  - id: player-contract
    description: Плеер встраивается по контракту, недоступное видео показывает статус
    steps:
    - Открыть страницу серии
    - Убедиться в наличии элемента плеера с атрибутами контракта
    - Смоделировать событие noData
    - Убедиться, что вместо подмены показан честный статус
  - id: rights-gate
    description: Материал без подтверждённых прав не получает плеер
    steps:
    - Открыть страницу тайтла без подтверждённых прав
    - Убедиться, что страница отвечает 200 и объясняет причину
    - Убедиться, что параметров плеера в разметке нет
  - id: cross-site-uniqueness
    description: Индексируемые страницы трёх сайтов не совпадают между собой
    steps:
    - Собрать индексируемые адреса из sitemap каждого сайта
    - Сравнить заголовки, описания, H1 и основной текст
    - Убедиться, что критических совпадений нет
rollback_policy:
