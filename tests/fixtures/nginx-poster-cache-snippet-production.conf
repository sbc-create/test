# Отдача постеров через локальный кэш. Подключается в apex-сервер каждой витрины.
location ^~ /poster/ {
    auth_basic off;

    # Адрес назначения задан статически ниже и не берётся из запроса: имя файла
    # выделено картой `$poster_file` (conf.d), всё прочее отбрасывается здесь.
    if ($poster_file = "") {
        return 404;
    }

    # Имя поставщика разрешается на каждом запросе, а не один раз при загрузке
    # конфигурации. Без этого nginx закрепляет адрес, снятый при последней
    # перезагрузке, и постеры, появившиеся у поставщика позже, отдаются
    # заглушкой, пока кто-нибудь не выполнит reload.
    resolver 8.8.8.8 1.1.1.1 valid=60s ipv6=off;
    resolver_timeout 5s;
    set $poster_origin "poster.cdnvideohub.com";


    proxy_pass https://$poster_origin/$poster_file;
    proxy_ssl_server_name on;
    proxy_set_header Host poster.cdnvideohub.com;
    proxy_set_header User-Agent "yummyani-poster-cache";
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;

    # Перенаправление не выполняется и не передаётся дальше. Сам nginx по нему
    # не идёт, но браузер по такому <img> пошёл бы — а адрес назначения задаёт
    # источник. Поэтому 3xx превращается в заглушку наравне с отказом.
    proxy_redirect off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    5s;

    proxy_cache yummy_posters;
    proxy_cache_key "$uri";
    proxy_cache_valid 200 30d;
    # Отрицательный кэш: повторяющийся 404 не должен ходить в CDN каждый раз.
    proxy_cache_valid 404 10m;
    # Перенаправление на заглушку провайдера — тот же отрицательный ответ,
    # только другим кодом. Без этой строки он не кэшировался вовсе.
    proxy_cache_valid 301 302 307 10m;
    proxy_cache_valid 500 502 503 504 0;
    proxy_no_cache $poster_uncacheable;

    # Параллельные промахи по одному адресу схлопываются в один запрос к CDN.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;

    # Последняя целая копия переживает отказ CDN, а обновление идёт в фоне,
    # не задерживая ответ.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_revalidate on;

    proxy_hide_header Set-Cookie;
    proxy_hide_header Vary;
    # Провайдер отдаёт Cache-Control: max-age=600. proxy_ignore_headers ниже
    # заставляет nginx не считаться с ним при решении о кэшировании, но из
    # ответа его не убирает: заголовок уезжал к посетителю рядом с нашим
    # max-age=2592000. По RFC 9111 поля склеиваются и побеждает первое
    # значение, то есть браузер держал постер десять минут вместо тридцати
    # суток — ровно наоборот замыслу.
    proxy_hide_header Cache-Control;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;

    # Заглушка, если целой копии не было никогда.
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 404 500 502 503 504 = @poster_placeholder;

    add_header X-Poster-Cache $upstream_cache_status always;
    add_header Cache-Control "public, max-age=2592000, stale-if-error=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location @poster_placeholder {
    internal;
    root /var/www/yummy-static;
    try_files /poster-placeholder.svg =404;
    default_type image/svg+xml;
    add_header X-Poster-Cache "PLACEHOLDER" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
}
