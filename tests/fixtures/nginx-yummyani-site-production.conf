# Фикстура: ФАКТИЧЕСКАЯ конфигурация yummyani.site с claude-control-01,
# снятая 2026-08-25, до установки панели.
#
# Зачем настоящая, а не сочинённая: локальные тесты на выдуманном vhost
# проходили, а боевая установка возвращала 401. Проверять разбор и вставку
# нужно на той структуре, которая реально обслуживает домен, — с тремя server
# блоками (:80 redirect, :443 www -> apex, :443 apex), с Basic Auth в
# `location /` и с ACME-локацией, где auth_basic отключён.
#
# Секретов здесь нет: только пути к сертификату и htpasswd. Содержимое ни
# того ни другого в репозиторий не попадает.
# yummyani.site — public staging origin.
#
# Basic Auth stays on: the site is not open to the public yet. Indexing is shut
# off at this layer as well as in the app, because a header the app forgets is
# still a header the crawler sees.

# HTTP: ACME first, then everything to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name yummyani.site www.yummyani.site;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        auth_basic off;
    }

    # 308 keeps the method and body, so a POST is not silently downgraded to GET.
    location / {
        return 308 https://yummyani.site$request_uri;
    }
}

# HTTPS www -> apex. One canonical host, one certificate.
server {
    # `http2 on;` needs nginx 1.25.1; the host runs 1.18, where HTTP/2 is a
    # listen parameter. Written this way the config loads on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yummyani.site;

    ssl_certificate     /etc/letsencrypt/live/yummyani.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yummyani.site/privkey.pem;
    include /etc/nginx/snippets/yummyani-ssl.conf;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        auth_basic off;
    }

    location / {
        return 308 https://yummyani.site$request_uri;
    }
}

# HTTPS apex -> the tenant's own container on loopback.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yummyani.site;

    ssl_certificate     /etc/letsencrypt/live/yummyani.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yummyani.site/privkey.pem;
    include /etc/nginx/snippets/yummyani-ssl.conf;

    server_tokens off;
    client_max_body_size 2m;

    # Indexing stays closed here regardless of what the app emits.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/yummyani.site.access.log;
    error_log  /var/log/nginx/yummyani.site.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        auth_basic off;
    }

    location / {
        auth_basic "YummyAnime staging";
        auth_basic_user_file /etc/nginx/yummyani-staging.htpasswd;

        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;

        # The app builds canonical, Open Graph and sitemap from the Host it is
        # given, so the public host must survive the hop unchanged.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       on;
    }

}
