# Локальный кэш постеров CDNVideoHub.
#
# Зачем. Постеры отдаются браузеру прямо с poster.cdnvideohub.com: у компонента
# стоит `unoptimized`, оптимизатор Next не участвует, локальной копии нет ни
# одной. Пока CDN отвечает — всё хорошо; при 502 у всех посетителей сразу
# ломаются все картинки. В 02C такой сбой уже случался и был принят мною за
# дефект витрины.
#
# Что даёт этот слой: свежая локальная копия, а при отказе CDN — последняя
# заведомо целая (stale-if-error). Если валидной копии не было никогда, отдаётся
# локальная заглушка постоянного размера, поэтому вёрстка не съезжает.
#
# Ограничение диска (02F, Stage 9): свободно было 8,1 ГБ, 10 % = 830 МБ,
# правило min(2 ГБ, 10 %) даёт 830 МБ. Взято 700 МБ — запас для релизов и
# отката. При среднем постере 57 КБ это около 12 000 файлов, тогда как весь
# каталог — 6774 аниме (≈386 МБ). Кэш не может вытеснить релизы.
proxy_cache_path /var/cache/nginx/yummy-posters
    levels=1:2
    keys_zone=yummy_posters:16m
    max_size=700m
    inactive=30d
    use_temp_path=off;

# Ответ не от изображения кэшировать нельзя: страница ошибки с кодом 200
# отравила бы кэш на месяц.
map $upstream_http_content_type $poster_not_image {
    default                 1;
    ~*^image/               0;
}

# Слишком большой ответ не кэшируем. Точного числового сравнения в map нет,
# поэтому проверяется разрядность: восемь и более цифр — это ≥10 МБ, тогда как
# постер весит около 57 КБ.
map $upstream_http_content_length $poster_too_big {
    default                 0;
    "~^[0-9]{8,}$"        1;
}

# Перенаправление вместо картинки. У отсутствующего постера провайдер отвечает
# не 404, а 302 на свою заглушку — с типом text/html. Карта выше помечала такой
# ответ некэшируемым, поэтому `proxy_cache_valid 404 10m` не срабатывал никогда,
# и каждый отсутствующий постер заново уходил в CDN. Замер 3 сентября: на
# глубоких страницах Lords таких 30 % запросов, 0,19–0,26 с против 0,09 с на
# попадании.
#
# Перенаправление кэшируется ненадолго. Тело его всё равно не показывается:
# `proxy_intercept_errors` подменяет ответ заглушкой, и подмена работает и для
# ответа, отданного из кэша.
map $upstream_status $poster_redirect {
    default                 0;
    "~^30[1237]$"           1;
}

map "$poster_not_image$poster_too_big$poster_redirect" $poster_uncacheable {
    default                 1;
    "000"                   0;
    "101"                   0;
}

# Имя файла постера выделяется здесь, а не в `if` внутри location.
#
# Раньше location только ПРОВЕРЯЛ адрес регулярным выражением, а сам адрес
# назначения задавался как `proxy_pass https://poster.cdnvideohub.com/` —
# именем, без переменной. Имя без переменной nginx разрешает ОДИН раз, при
# загрузке конфигурации, и держит полученный адрес всё время жизни worker.
# У `poster.cdnvideohub.com` TTL записи 120 секунд и адрес меняется; nginx же
# продолжал ходить на адрес, снятый в момент последней перезагрузки. Тот узел
# отвечал, но новых объектов на нём не было: каждый постер, загруженный
# поставщиком ПОСЛЕ перезагрузки nginx, получал 404 и подменялся заглушкой.
# Старые постеры при этом отдавались из дискового кэша и скрывали отказ.
map $uri $poster_file {
    default                                                                                                    "";
    "~^/poster/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(?:webp|jpg|jpeg|png))$"          $1;
}
