[pytest]
testpaths = tests
python_files = test_*.py
# importlib: у фабрики и SEO-оператора есть одноимённые файлы тестов в разных
# каталогах (tests/unit/test_audit.py и tests/test_audit.py). При классическом
# импорте pytest выводит имя модуля из базового имени файла, и второй такой файл
# отказывается собираться целиком. importlib различает их по полному пути,
# поэтому оба набора живут рядом без переименований.
addopts = -ra --strict-markers --import-mode=importlib
markers =
    slow: тесты, поднимающие сервер или браузер (запускаются в полном прогоне)
    browser: тесты, требующие Chromium
# Временные каталоги прогонов: хранить ОДИН и только при провале.
#
# Измерено 23.10 при свободных 2,0 ГиБ на хосте: `/tmp/pytest-of-claude` занял
# 1,3 ГиБ в четырнадцати каталогах, из них каталоги от 20.10 и 22.10 — по
# 150–172 МБ каждый.
#
# ЧИСЛО УТОЧНЕНО ИЗМЕРЕНИЕМ, и первая оценка была завышена: каталог ОДНОГО
# прогона — около 250 МБ (101 МБ на 42 % прогона), а не полгигабайта. Гигабайт
# набрался из ЧЕТЫРНАДЦАТИ сохранённых прогонов, а не из размера одного. При
# 1 % свободного места (MOD-144, продолжение MOD-51) это всё равно не мелочь:
# серия прогонов сама приближала диск к стене, на которой 23.10 обрезалась
# суточная копия.
#
# `failed` вместо `all`: при зелёном прогоне содержимое не нужно вовсе, а при
# провале нужен ровно последний, чтобы посмотреть, что осталось.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
