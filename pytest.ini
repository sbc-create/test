[pytest]
testpaths = tests
python_files = test_*.py
# importlib: у фабрики и SEO-оператора есть одноимённые файлы тестов в разных
# каталогах (tests/unit/test_audit.py и tests/test_audit.py). При классическом
# импорте pytest выводит имя модуля из базового имени файла, и второй такой файл
# отказывается собираться целиком. importlib различает их по полному пути,
# поэтому оба набора живут рядом без переименований.
addopts = -ra --strict-markers --import-mode=importlib
markers =
    slow: тесты, поднимающие сервер или браузер (запускаются в полном прогоне)
    browser: тесты, требующие Chromium
