# Обязательная проверка PR. Герметична по построению: проверяет только
# воспроизводимые программные контракты — то, что верно в любом клоне
# репозитория на любой машине.
#
# Сюда НЕ добавляются проверки живого флота: перепись production, ответы
# публичных доменов, версия работающего реестра, состояние резервной копии,
# systemd-юниты и слушатели, снимок templates-cp-consumer. У раннера ничего
# этого нет, и такие проверки либо красят обязательный check без повода, либо
# — что хуже — маскируются `skip` и делают «не проверяли» неотличимым от
# «проверили, всё хорошо».
#
# Они живут в host-контуре и запускаются явно на control host:
#
#     HOST_ATTESTATION_CONTROL_HOST=1 bin/host-attest --candidate-sha <sha>
#
# Свидетельство этого прогона требуется воротами релиза, поэтому зелёный CI
# сам по себе выкат не разрешает. Подробности — docs/HERMETIC_CI_VS_HOST_ATTESTATION.md.
# Границу стережёт tests/unit/test_hermetic_ci_boundary.py.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Verify (schemas, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyyaml

      - name: Run full verification
        run: ./scripts/verify.sh

      - name: Confirm committed evidence is current
        run: |
          # The evidence report is a record of a real run. If verify.sh now
          # reports different stage results than the committed report, the
          # record is stale and must be regenerated.
          ./scripts/record-evidence.sh --check
