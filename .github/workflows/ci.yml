name: CI

# Порядок запуска выведен из замера расхода 13.10, а не из привычки.
#
# Этот репозиторий ОТКРЫТ, его минуты Actions бесплатны (276 мин за 48 ч в
# бюджет не входят). Правка нужна не ради денег, а ради двух других вещей:
#
# 1. В репозитории 49 открытых PR, и без `concurrency` каждый push в ветвь PR
#    запускал полную приёмку, не отменяя прежнюю. Параллельные задания
#    расходуют ОБЩИЙ для учётной записи предел одновременных заданий и
#    задерживают тяжёлые закрытые прогоны, которые платят за квоту.
# 2. Полная приёмка шла и на коммитах, меняющих только документацию и отчёты.
#
# Что НЕ сокращено: на изменениях кода, схем, инструментов, зависимостей и
# самих рабочих процессов приёмка запускается как раньше, целиком.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'reports/**'
      - 'adr/**'
      - 'artifacts/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'reports/**'
      - 'adr/**'
      - 'artifacts/**'
      - '**/*.md'

concurrency:
  # Ветвь входит в группу: прогоны разных PR не выстраиваются в очередь.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # На рабочей ветви и в PR новый коммит отменяет прежний прогон: его
  # результат уже не относится к голове. На `main` отмена ВЫКЛЮЧЕНА — там
  # прогон удостоверяет выпускаемое состояние, и обрывать его нельзя.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify (schemas, lint, tests)
    runs-on: ubuntu-latest
    # Измеренная длительность приёмки — около 2,7 мин; предел даёт запас на
    # медленный раннер и не позволяет зависшему заданию держать слот шесть
    # часов по умолчанию.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyyaml

      - name: Run full verification
        run: ./scripts/verify.sh

      - name: Confirm committed evidence is current
        run: |
          # The evidence report is a record of a real run. If verify.sh now
          # reports different stage results than the committed report, the
          # record is stale and must be regenerated.
          ./scripts/record-evidence.sh --check
