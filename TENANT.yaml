# Идентификаторы выданы аллокатором, а не выбраны.
# automation/host/zonafilm-cc-allocate.py --family zona --domain zonafilm.cc \
#   --service-name-source runtime_registry
allocation:
  site_id: zona-02
  service_name: nova-zona-02.service
  port: 9123
  evidence: artifacts/evidence/release-zonafilm-cc-full-cycle-01/04-site-creation/allocation.json
  service_name_source: runtime_registry
  service_name_source_rationale: >-
    Реестры расходятся: config/release-registry.json называет для zona-01 юнит
    zona-01.service, а диспетчер и диск — nova-zona-01.service. Связывает
    runtime_registry: nginx zona-01.conf проксирует на 127.0.0.1:9120, ExecStart
    nova-zona-01.service слушает 9120, запись реестра называет тот же порт.
    zona-01.service — легаси serve.py на 9104, на который не ссылается ни один
    vhost. Три независимых совпадения против нуля.

# Неизменяемый шаблон. Зафиксирован по факту исполнения, а не по манифесту.
pinned_template:
  family: zona
  release_dir: /srv/lords/.frontend/releases/zona-slider-2650fad6
  code_sha256: 7ccf094a1d7f2b5e648a38f51f6a63de9627576637d96f6c966fe1759ad8fa1e
  source_commit: 5863d296264867f85138bd771f1b90a86ac9c599
  built_at: "2026-09-21T16:29:37Z"
  evidence: artifacts/evidence/release-zonafilm-cc-full-cycle-01/02-start-point/template-pin.md
  why_not_newer: >-
    /srv/lords/.frontend/zona-01-frontend.py (sha256 bbd6467f…, commit 6513e7e7)
    новее и объявлен в template-manifest-zona-01.json, но не назначен: ссылка
    sites/zona-01/current ведёт на zona-slider-2650fad6, а живая выдача
    127.0.0.1:9120 не содержит ни одного data-zhero-* — разметки, которая есть
    только в новом артефакте. Он не опубликован, это незавершённая работа
    соседнего терминала, и брать её значило бы подхватить чужие коммиты.

