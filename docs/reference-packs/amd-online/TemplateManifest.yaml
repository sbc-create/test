# Манифест шаблона Animedia (amd.online).
#
# Черновик снят частично. Геометрия и типографика теперь измерены на самом
# референсе (VISUAL_TOKENS.yaml, 357 замеров на пяти поверхностях и трёх
# ширинах). Структура маршрутов по-прежнему наша: она описана своими словами
# и с референса не копировалась.
#
# Почему статус всё ещё draft — см. ACCEPTANCE.md: не заполнены диапазоны
# совместимости, и в репозитории нет утверждённого алгоритма визуального
# сравнения. Ни то, ни другое замером не закрывается.

schemaVersion: 1
templateId: animedia-anime-portal
templateVersion: 0.0.1-draft
family: reference-draft

status: draft
productionEnabled: false
indexingEnabled: false

reference:
  url: https://amd.online/
  provenance: Change Request v2.0 от 22.08.2026, раздел 3
  access: reachable
  blocker: null
  accessCheckedAt: "2026-09-16"
  accessEvidence: artifacts/reference-pack-amd-online-01/availability.json
  observations: 8
  observationsMeasured: 4
  measuredTokens: 357
  measurementEvidence: docs/reference-packs/amd-online/VISUAL_TOKENS.yaml

# Диапазоны совместимости остаются pending намеренно: это решение об
# архитектуре, а не величина, которую можно снять с чужой страницы. Замер их
# не закрывает, и подставить сюда правдоподобные значения означало бы ровно ту
# подмену, против которой написан весь пакет.
compatibility:
  status: pending
  onIncompatibleContract: fail_build
  apiVersionRange: pending
  sdkVersionRange: pending
  seoContractVersionRange: pending
  allowLatest: false

previewCapabilities:
  requiresDatabase: false
  requiresSecrets: false
  states: [normal, empty, degraded, not_found]

performanceBudgets:
  lcpMs: 2500
  cls: 0.1
  inpMs: 200

featureFlags:
  adSlots:
    default: disabled
    onDisabled: no_dom
    onEnabled: reserve_geometry
    networkIntegration: forbidden

routes:
    - routeId: home
      pageType: homepage
      path: /
      blockOrder: [header, search, shelves, footer]
    - routeId: catalog
      pageType: catalog
      path: /catalog
      blockOrder: [header, search, shelves, footer]
    - routeId: title
      pageType: title
      path: /title/{slug}
      blockOrder: [header, search, shelves, footer]
    - routeId: search
      pageType: search
      path: /search
      blockOrder: [header, search, shelves, footer]
    - routeId: not-found
      pageType: error
      path: '*'
      blockOrder: [header, search, shelves, footer]

blocks:
  source: blocks.yaml
