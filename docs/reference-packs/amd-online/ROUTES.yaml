# Маршруты черновика amd-online.
schemaVersion: 1
templateId: animedia-anime-portal

routes:
  - routeId: home
    pageType: homepage
    path: /
    blockOrder: [header, search, shelves, footer]
  - routeId: catalog
    pageType: catalog
    path: /catalog
    blockOrder: [header, search, shelves, footer]
  - routeId: title
    pageType: title
    path: /title/{slug}
    blockOrder: [header, search, shelves, footer]
  - routeId: search
    pageType: search
    path: /search
    blockOrder: [header, search, shelves, footer]
  - routeId: not-found
    pageType: error
    path: '*'
    blockOrder: [header, search, shelves, footer]
