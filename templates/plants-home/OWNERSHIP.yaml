template: plants-home
variant_id: plant-catalog
branch: claude/template-plants-home
worktree: /home/claude/wt-template-plants-home
base_commit: a7f7cb6236fbc9770af949ef98eae511cd3c8fc4   # origin/main
owner_scope:
  write: [templates/plants-home/**]
  shared_files_touched:
