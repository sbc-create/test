template: plants-home
variant_id: pick-and-diagnose
branch: claude/template-plants-home-b
worktree: /home/claude/wt-template-plants-home-b
base_commit: f0f5251   # зафиксированный commit собственного варианта A; A — от origin/main a7f7cb6
owner_scope:
  write: [templates/plants-home/**]
  shared_files_touched:
    - path: inventory/network-allowlist.yaml
      why: "3 хоста источника и референсов по заданию ночи 12–13.10.2026, только GET"
    - path: tests/unit/test_permission_matrix.py
      why: "тест точного состава allowlist"
runtime:
  process: "python3 -m flora.server (pid var/plants-home/run/preview.pid)"
  bind: 127.0.0.1:8856
  data: templates/plants-home/data (факты видов, карточки, content.json)
  private: var/plants-home/private (страницы источника, 0700, вне git)
  build: var/plants-home/build/<commit>
  qa_dependencies: templates/plants-home/qa (axe-core 4.13.0, свой lockfile)
  browser_storage_namespace: "ph-pick"
network_contracts: []
shared_with_other_templates: []
