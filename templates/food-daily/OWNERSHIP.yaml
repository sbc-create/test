# Владение и границы записи шаблона food-daily (TEMPLATE-FOOD-DAILY-01).
# Проверяется tests/test_isolation.py и командой `git diff --stat <base>..HEAD`.
template: food-daily
branch: claude/template-food-daily
worktree: /home/claude/wt-template-food-daily
base_commit: a7f7cb6236fbc9770af949ef98eae511cd3c8fc4   # main на момент старта, 11.10.2026
owner_scope:
  write:
    - templates/food-daily/**                  # всё: код, шаблоны, стили, данные, тесты, отчёты
  shared_files_touched:                        # минимальные правки вне области шаблона, с причиной
    - path: inventory/network-allowlist.yaml
      why: "хосты аудита из ТЗ, только GET, провенанс в каждой записи"
    - path: tests/unit/test_permission_matrix.py
      why: "тест закрепляет точный состав allowlist; 14 хостов из ТЗ добавлены в ожидаемый набор осознанно"
  must_not_touch:
    - themes/**
    - sites/**                                 # пакеты DLE-сайтов фабрики
    - factory/**                               # общее ядро
    - seo_operator/**
    - .claude/**
    - .github/**
    - package.json
    - package-lock.json
    - requirements.txt
    - other worktrees under /home/claude/wt-*
runtime:
  process: "python3 -m fooddaily.server (pid-файл var/food-daily/run/preview.pid)"
  bind: 127.0.0.1:8847
  db: var/food-daily/preview/food-daily.sqlite3      # собственный файл SQLite, meta.site_id=food-daily
  private_sources: var/food-daily/private            # 0700, вне git, срок хранения 30 дней
  media: var/food-daily/media                        # пусто: готовых медиа нет
  crawl_state: var/food-daily/crawl
  http_cache: var/food-daily/cache
  queue: "таблица jobs в собственной БД + var/food-daily/qwen/{outbox,inbox}"
  build: var/food-daily/build/<commit>
  editor_secret: file:~/.config/food-daily-preview/editor.json   # вне репозитория, 0600
  search_index: "в памяти процесса, строится из снимка контента"
  compose_project: null
  network: "только петля; исходящие — только allowlist, только GET"
dependencies:
  python: [Jinja2==3.1.6, PyYAML==6.0.1, jsonschema==4.26.0]   # закреплены в requirements.txt фабрики, не менялись
  qa_only: [playwright (Python, пользовательское окружение), Chromium headless shell 1234]
  factory_api_used: []                                      # невизуальные API ядра в рантайме не используются
