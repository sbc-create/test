{% extends "base.html" %}
{% from "_parts.html" import grid %}
{% block main %}
<section class="empty empty--404">
  <p class="empty__code">404</p>
  <h1>Такой страницы нет</h1>
  <p>Возможно, рецепт переехал или в адресе опечатка.</p>
  <form class="search search--page" action="/poisk/" method="get" role="search">
    <label for="q404" class="sr">Поиск рецептов</label>
    <input id="q404" name="q" type="search" placeholder="Блюдо">
    <button type="submit">Найти</button>
  </form>
  <p><a class="btn" href="/">На главную</a> <a class="btn btn--ghost" href="/recepty/">Все рецепты</a></p>
</section>
{% if recipes %}<section class="block"><h2>Свежие рецепты</h2>{{ grid(recipes) }}</section>{% endif %}
{% endblock %}
