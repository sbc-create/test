template: food-baking
branch: claude/template-food-baking
worktree: /home/claude/wt-template-food-baking
base_commit: a7f7cb6236fbc9770af949ef98eae511cd3c8fc4   # origin/main 12.10.2026, не ветка другого шаблона
owner_scope:
  write: [templates/food-baking/**]
  shared_files_touched:
    - path: inventory/network-allowlist.yaml
      why: "3 хоста по заданию NIGHT-CONTINUE-02 (2 референса из задания + eda.rambler.ru), только GET"
    - path: tests/unit/test_permission_matrix.py
      why: "тест точного состава allowlist: 3 хоста добавлены осознанно"
runtime:
  process: "python3 -m bakebook.server (pid var/food-baking/run/preview.pid)"
  bind: 127.0.0.1:8848
  content: templates/food-baking/data/content.json   # файловый снимок, БД нет
  private_sources: var/food-baking/private            # 0700, вне git
  build: var/food-baking/build/<commit>
  editor_secret: "file:~/.config/food-baking-preview/editor.json"
  qa_dependencies: templates/food-baking/qa (axe-core 4.13.0, свой package-lock.json)
shared_with_other_templates: []                        # код, CSS, JS, assets, сборка — только свои
