{% extends "base.html" %}
{% block main %}
<h1>Виды теста</h1>
<p class="lead">Вид теста определяется по составу рецепта: дрожжи, разрыхлитель или сода, заваривание муки на огне.</p>
<ul class="doughs">{% for k, items in site.doughs().items() %}<li><a href="/testo/{{ k }}/"><b>{{ DOUGH[k][0] }}</b><span>{{ DOUGH[k][1] }}</span><i>{{ items|length }}</i></a></li>{% endfor %}</ul>
{% endblock %}
