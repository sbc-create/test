# food-baking — «Тесто и десерты». Отдельная конфигурация, ничего общего с другими сайтами сети.
site_id: food-baking
name: "Тесто и десерты"            # рабочее название, не проверено
variant_id: bake-batch   # вариант C: пеку несколько — общий список продуктов и порядок духовки
variant_version: "1"
mode: preview                      # production — отдельный переключатель, нужен домен
production_authorized: false
origin:
  preview: "http://127.0.0.1:8875"
  production: null                 # BLOCKED_INPUT: домен не выбран
server:
  bind: 127.0.0.1
  port: 8875
storage_namespace: "fbc"           # localStorage: fbc.* (у A хранилища нет, у B — fbb.*)
per_page: 12
storage:
  private_sources: var/food-baking/private
  build: var/food-baking/build
  editor_secret: "~/.config/food-baking-c-preview/editor.json"
ads:
  adapter: disabled
