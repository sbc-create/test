# food-baking — «Тесто и десерты». Отдельная конфигурация, ничего общего с другими сайтами сети.
site_id: food-baking
name: "Тесто и десерты"            # рабочее название, не проверено
mode: preview                      # production — отдельный переключатель, нужен домен
production_authorized: false
origin:
  preview: "http://127.0.0.1:8848"
  production: null                 # BLOCKED_INPUT: домен не выбран
server:
  bind: 127.0.0.1
  port: 8848
per_page: 12
storage:
  private_sources: var/food-baking/private
  build: var/food-baking/build
  editor_secret: "~/.config/food-baking-preview/editor.json"
ads:
  adapter: disabled
