{% extends "base.html" %}
{% block main %}
<h1>Помещения</h1>
<p class="lead">Если удобнее начать с комнаты — здесь инструкции по каждой.</p>
<ul class="plain">{% for k, v in ROOMS.items() %}{% set n = site.in_room(k)|length %}<li><a href="/pomeshcheniya/{{ k }}/">{{ v }}</a> <span>{{ n }} {{ plural(n, 'инструкция', 'инструкции', 'инструкций') }}</span></li>{% endfor %}</ul>
{% endblock %}
