template: home-practical
variant_id: rooms-cards
branch: claude/template-home-practical
worktree: /home/claude/wt-template-home-practical
base_commit: a7f7cb6236fbc9770af949ef98eae511cd3c8fc4   # origin/main, не ветка другого шаблона
owner_scope:
  write: [templates/home-practical/**]
  shared_files_touched:
    - path: inventory/network-allowlist.yaml
      why: "4 хоста источников и референсов по заданию ночи 12–13.10.2026, только GET"
    - path: tests/unit/test_permission_matrix.py
      why: "тест точного состава allowlist"
runtime:
  process: "python3 -m udobdom.server (pid var/home-practical/run/preview.pid)"
  bind: 127.0.0.1:8851
  data: templates/home-practical/data (факты источников, материалы, content.json)
  private: var/home-practical/private (страницы источников, 0700, вне git)
  build: var/home-practical/build/<commit>
  qa_dependencies: templates/home-practical/qa (axe-core 4.13.0, свой lockfile)
  browser_storage_namespace: "hp-rooms"
network_contracts: []
shared_with_other_templates: []
