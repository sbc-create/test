template: food-weekly
variant_id: agenda-trips   # вариант B; A — ветка claude/template-food-weekly, порт 8849, ключи fw.*
branch: claude/template-food-weekly-b
worktree: /home/claude/wt-template-food-weekly-b
base_commit: 734c07e   # вариант A (claude/template-food-weekly)
owner_scope:
  write: [templates/food-weekly/**]
  shared_files_touched:
    - path: inventory/network-allowlist.yaml
      why: "3 хоста аудита по заданию NIGHT-CONTINUE-02, только GET"
    - path: tests/unit/test_permission_matrix.py
      why: "тест точного состава allowlist"
runtime:
  browser_storage_namespace: "fwb.bought.<план>:<1|2|all>"
  process: "python3 -m weekplan.server (pid var/food-weekly/run/preview.pid)"
  bind: 127.0.0.1:8865
  data: templates/food-weekly/data (планы + снимок каталога food-daily)
  build: var/food-weekly/build/<commit>
  qa_dependencies: templates/food-weekly/qa (axe-core 4.13.0, свой lockfile)
network_contracts:
  - consumer_of: "food-daily /api/catalog.v1.json (recipe-catalog/1), только 127.0.0.1 в preview"
shared_with_other_templates: []
