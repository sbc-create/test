{% macro tracker_row(g) %}
<tr data-slug="{{ g.slug }}" data-red="{{ g.red }}" data-sides="{{ site.side_letters(g)|join('') }}">
  <th scope="row"><a href="{{ g.url }}">{{ g.title }}</a></th>
  <td>{% if g.red %}<label class="sr" for="red-{{ g.slug }}">Собрано красных клубник: {{ g.title }}</label><input id="red-{{ g.slug }}" class="num" type="number" min="0" max="{{ g.red }}" value="0" inputmode="numeric" data-red-input disabled> <span class="of">/ {{ g.red }}</span>{% else %}<span class="of">—</span>{% endif %}</td>
  <td>{% for l in site.side_letters(g) %}<label class="side"><input type="checkbox" data-side="{{ l }}" disabled><span>{{ l }}</span></label>{% else %}<span class="of">{% if g.sides %}{{ g.sides }}{% else %}—{% endif %}</span>{% endfor %}</td>
</tr>
{% endmacro %}
{% macro video(v) %}
<figure class="vid" data-vid="{{ v.video_id }}">
  <figcaption><b>{{ v.name }}</b> — канал <a href="{{ v.channel_url }}" rel="nofollow noopener">{{ v.channel }}</a></figcaption>
  <p class="vid__links"><a class="btn btn--line" href="{{ v.url }}" rel="nofollow noopener">Смотреть на YouTube</a> <button type="button" class="btn" data-play hidden>Показать плеер здесь</button></p>
  <p class="note">Плеер загружается с youtube-nocookie.com только после нажатия.</p>
</figure>
{% endmacro %}
