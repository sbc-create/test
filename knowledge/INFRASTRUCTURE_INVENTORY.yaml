# INFRASTRUCTURE_INVENTORY — безопасный реестр инфраструктуры (без секретов)
schema_version: 1
collected_at: "2026-08-21T21:24:00Z"
method: read_only
production_touched: false

summary: >-
  Целевой инфраструктуры не передано. Инвентаризация выполнена на пустом множестве:
  ни SSH-хостов, ни доменов, ни DNS-зон, ни существующих сайтов, ни веб-серверов,
  ни СУБД, ни TLS-сертификатов, ни бэкапов, ни мониторинга, ни CI/CD в сессию не поступало.
  Это подтверждённый факт (F1.1–F1.4), а не пропущенный шаг.

control_host:              # машина, на которой сейчас работает фабрика
  role: factory_control_ephemeral
  os: "Ubuntu 24.04.4 LTS"
  kernel: "6.18.44"
  cpus: 4
  memory_gb: 15.7
  disk_avail_gb: 30
  ephemeral: true
  note: "Контейнер сессии Claude Code. Не является production- или staging-хостом."
  toolchain:
    python: "3.11.15"
    php: "8.4.19 (cli, NTS)"
    node: "22.22.2"
    npm: "10.9.7"
    git: "2.43.0"
    curl: "8.5.0"
    jq: "1.7"
    docker_cli: "29.3.1"
  missing_toolchain:
    - ansible          # требуется для ssh_ansible target
    - nginx            # нет возможности запустить nginx -t локально
    - mysql_client
    - shellcheck
    - rsync
  docker_daemon: unavailable   # /var/run/docker.sock отсутствует → контейнерный пилот невозможен

network_policy:
  egress: policy_enforcing_proxy
  reachable:
    - code.claude.com
    - pypi.org
    - files.pythonhosted.org
    - registry.npmjs.org
  blocked_403_at_connect:
    - dle-news.com
    - developers.google.com
    - yandex.ru
    - web.dev
    - playwright.dev
  policy: "Обход запрещён. Заблокированные хосты отражены в SOURCE_REGISTRY как unavailable_blocked."

ssh_hosts: []          # ни одного хоста не передано
dns_zones: []
domains: []
existing_sites: []
web_servers: []
databases: []
tls_certificates: []
backup_targets: []
monitoring: []
ci_cd:
  - id: github-actions
    status: available_but_unconfigured
    note: "Репозиторий sbc-create/test доступен через GitHub MCP; workflow не создавались."

pre_existing_components:
  dle_publishing_module: not_provided
  metadata_analysis_service: not_provided
  site_provisioning_service: not_provided
  monitoring_service: not_provided
  note: >-
    §1.3 требует переиспользовать работоспособное. Переиспользовать нечего: ни одного
    компонента не передано. Как только они появятся, аудит выполняется скиллом
    /research-freeze до создания параллельного контура.
