# INFRASTRUCTURE_INVENTORY — безопасный реестр инфраструктуры (без секретов)
schema_version: 1
collected_at: "2026-08-23T14:20:00Z"
method: read_only
production_touched: false

summary: >-
  Появился один постоянный хост — управляющий сервер claude-control-01, он же
  первый web-сервер. Целевой инфраструктуры по-прежнему не передано: ни доменов,
  ни DNS-зон, ни лицензий DLE, ни контрактов интеграций, ни существующих сайтов.
  Это подтверждённый факт (F1.1–F1.4), а не пропущенный шаг. Пустая запись в
  реестре означает BLOCKED_INPUT.

control_host:              # постоянный управляющий сервер фабрики
  id: claude-control-01
  role: [control, initial-web]
  provider: Zomro
  platform: "KVM / OpenStack Nova"
  ipv4: 45.131.182.225        # инфраструктурный идентификатор, не секрет
  ssh_user: claude
  ssh_port: 22
  ssh_auth: publickey_only    # пароли отключены, root — только по ключу
  os: "Ubuntu 22.04.5 LTS"
  kernel: "5.15.0-190-generic"
  cpus: 4
  memory_gb: 9.7
  disk_total_gb: 68
  swap_gb: 4
  ephemeral: false
  production_capable: false   # ни одни ворота production не пройдены
  note: >-
    Постоянный сервер, введённый в эксплуатацию 2026-08-23. Заменяет прежнюю
    запись об эфемерном контейнере сессии. production_capable остаётся false,
    пока пусты реестры доменов, DNS-зон, лицензий и не передана авторизация.
  base_paths:
    repo: /srv/site-factory/repo
    sites: /srv/sites
    backups: /srv/backups
    logs: /var/log/site-factory
    host_env: /etc/site-factory/environment
    browsers: /opt/pw-browsers
  toolchain:
    python: "3.11.16"          # uv-managed; совпадает с python-version в CI
    python_system: "3.10.12"
    php: "8.1.2 (cli, NTS)"
    node: "22.23.2"
    npm: "10.9.8"
    playwright: "1.62.1"
    chromium: "151.0.7922.34"
    firefox: "153.0"
    webkit: "26.5"
    postgresql: "16.15"
    nginx: "1.18.0"
    ansible_core: "2.19.12"
    ansible_lint: "26.8.0"
    docker: "29.7.2"
    docker_compose: "5.5.0"
    git: "2.34.1"
    gh: "2.98.0"
    shellcheck: "0.8.0"
    rsync: "3.2.7"
    uv: "0.12.5"
    claude_code: "2.1.231"
  missing_toolchain:
    - mysql_client           # DLE-контур не разворачивается: дистрибутив не передан
  docker_daemon: available
  ansible_collections:
    - community.general
    - ansible.posix
  scheduled_units:           # automation/host/systemd, ставятся install-units.sh
    enabled:
      - site-factory-health.timer      # каждые 15 мин
      - site-factory-backup.timer      # 03:20 UTC, с проверкой восстановления
      - site-factory-selfcheck.timer   # 04:00 UTC, read-only
      - site-factory-seo-dryrun.timer  # 06:00 UTC, dry-run на фикстуре
    disabled:
      - site-factory-worker.timer      # очередь пуста, ни одна цель не production_capable
  public_ports: [22, 80, 443]
  hardening:
    ssh_password_auth: disabled
    ssh_root_login: prohibit-password
    ufw: active
    fail2ban: active
    unattended_upgrades: active
    docker_user_chain: enforced        # опубликованные порты не обходят политику
    swap_swappiness: 10

network_policy:
  egress: policy_enforcing_proxy
  reachable:
    - code.claude.com
    - pypi.org
    - files.pythonhosted.org
    - registry.npmjs.org
  blocked_403_at_connect:
    - dle-news.com
    - developers.google.com
    - yandex.ru
    - web.dev
    - playwright.dev
  policy: "Обход запрещён. Заблокированные хосты отражены в SOURCE_REGISTRY как unavailable_blocked."

ssh_hosts: []          # ни одного хоста не передано.
                       # claude-control-01 сюда НЕ добавлен намеренно: фабрика
                       # работает на нём локально, SSH-цель для этого не нужна,
                       # а inventory/ssh-hosts.yaml закрыт deny-правилом —
                       # записи в него вносит человек, а не агент.
dns_zones: []
domains: []
existing_sites: []
web_servers:
  - id: claude-control-01-nginx
    version: "1.18.0"
    host: claude-control-01
    vhosts: [000-default-deny]     # catch-all: 404 + noindex, сайтов ещё нет
    serves_production: false
databases:
  - id: claude-control-01-postgres
    engine: postgresql
    version: "16.15"
    listen: "127.0.0.1:5432"       # наружу не слушает
    scopes: [anime]                # стенд blueprint payload-next-multisite
    production: false
tls_certificates: []
backup_targets:
  - id: control-host-local
    path: /srv/backups
    scope: "состояние фабрики, конфигурация хоста, git-bundle репозитория"
    schedule: "ежедневно 03:20 UTC"
    restore_verified: true       # распаковка во временный каталог + сверка sha256
    offsite: false               # внешнего хранилища не передано — BLOCKED_INPUT
monitoring:
  - id: site-factory-health
    scope: "диск, inode, память, нагрузка, сервисы, TLS, свежесть бэкапа, nginx -t, публичные порты"
    schedule: "каждые 15 минут"
    delivery: systemd_unit_failure   # внешний канал не передан — BLOCKED_INPUT
ci_cd:
  - id: github-actions
    status: available_but_unconfigured
    note: "Репозиторий sbc-create/test доступен через GitHub MCP; workflow не создавались."

pre_existing_components:
  dle_publishing_module: not_provided
  metadata_analysis_service: not_provided
  site_provisioning_service: not_provided
  monitoring_service: not_provided
  note: >-
    §1.3 требует переиспользовать работоспособное. Переиспользовать нечего: ни одного
    компонента не передано. Как только они появятся, аудит выполняется скиллом
    /research-freeze до создания параллельного контура.
