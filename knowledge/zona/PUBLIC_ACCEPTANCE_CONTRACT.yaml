# Контракт публичной приёмки витрины Zona.
#
# Происхождение: задание владельца от 2026-09-21 — «разрешаю снять gate
# zona-public и выполнить production-deploy zonafilm.space». До этого запись
# `zona-public` в inventory/network-allowlist.yaml стояла без contract_ref, в
# отличие от соседних записей, и было непонятно, что именно ею разрешено:
# проверять ли только доступность домена или и содержимое страниц.
#
# Контракт отвечает ровно на этот вопрос и ничего не расширяет: домен уже был
# в allowlist, новых хостов сюда не добавлено.

schema_version: 1
contract_version: "ZONA_PUBLIC_ACCEPTANCE_v1"
received_at: "2026-09-21"
provenance: OWNER_TASK_2026-09-21
owner_decision_id: ZONA-PUBLIC-GATE-AND-DEPLOY-20260921-01

scope:
  host: zonafilm.space
  purpose: >-
    Приёмка боевой витрины: доступность, TLS, заголовки версии и артефакта,
    разметка страниц и их геометрия на поддерживаемых ширинах.

allowed:
  methods: [GET]
  note: >-
    Приёмка читает. Ни один запрос не меняет состояние витрины: ни формы, ни
    админка, ни сброс кэша сюда не входят.
  paths:
    - "/"
    - "/catalog/"
    - "/new/"
    - "/search/"
    - "/series/"
    - "/title/**"
    - произвольный несуществующий путь для проверки 404

forbidden:
  - Любые методы, кроме GET.
  - Запись, авторизация, работа с админкой и служебными эндпоинтами.
  - Изменение robots.txt, meta robots и заголовка X-Robots-Tag.
  - Изменение DNS и TLS-конфигурации.
  - Обращение к соседним витринам под видом приёмки Zona.

indexability:
  expected: "noindex, nofollow"
  mutations_allowed: 0
  note: >-
    Индексация и шаблон — независимые контуры. Приёмка обязана убедиться, что
    состояние индексации не изменилось, и не имеет права его менять.

evidence:
  matrix: artifacts/evidence/zona-slider-date-deploy-01/LIVE_MATRIX_*.json
  screenshots: artifacts/evidence/zona-slider-date-deploy-01/screenshots/
  note: >-
    Проверка на origin (127.0.0.1:9120) доказывает, что выложенный артефакт
    отдаёт правильно, но не проверяет публичный край и TLS. Для этого и нужен
    доступ к домену: у публичной проверки другой предмет, а не та же самая
    проверка с другого адреса.
