  - id: SRC-WEBDEV-CWV
    kind: official_documentation
    owner: Google / web.dev
    url: https://web.dev/articles/vitals
    status: unavailable_blocked
    evidence: "CONNECT web.dev:443 → 403"
  - id: SRC-PLAYWRIGHT
    kind: official_documentation
    owner: Microsoft
    url: https://playwright.dev/docs/best-practices
    status: unavailable_blocked
    evidence: "CONNECT playwright.dev:443 → 403"
  - id: SRC-W3C-WCAG22
    kind: standard
    owner: W3C
    url: https://www.w3.org/WAI/WCAG22/quickref/
    status: unavailable_blocked
    evidence: "не входит в allowlist egress policy"

  # ---------- переданное пользователем ----------
  - id: SRC-USER-MASTERPROMPT
    kind: user_specification
    owner: "user (ITAPX@yandex.com)"
    path: "(сообщение пользователя в сессии; производный нормативный экстракт — docs/MASTER_PROMPT_REQUIREMENTS.md)"
    derived_extract: docs/MASTER_PROMPT_REQUIREMENTS.md
    received_at: "2026-08-21T21:18:00Z"
    version: "Фабрика сайтов на DLE: мастер-промпт для Claude Code v1.1"
    status: approved
    authority: >-
      Единственный доступный нормативный источник по DLE-лицензии, VK-контуру и SEO-требованиям
      в этой сессии. Требования SEO-контура реализованы дословно по этому документу и помечены
      как подлежащие сверке с официальной документацией, когда egress-политика её откроет.
  - id: SRC-USER-INFRA
    kind: infrastructure_material
    owner: user
    status: not_provided
    evidence: >-
      Рабочий каталог содержал 0 файлов; ~/.ssh пуст; переменных окружения с SSH/DNS/VK/DLE
      реквизитами нет. Проверено `git status --porcelain`, `find`, `ls -la ~/.ssh`, `env | cut -d= -f1`.
  - id: SRC-USER-DLE-DIST
    kind: licensed_distribution
    owner: user
    status: not_provided
    required_for: "integration test чистой установки DLE, SHA-256 дистрибутива"
  - id: SRC-USER-VK-CATALOG
    kind: licensed_content_catalog
    owner: user
    status: not_provided
    required_for: "любой реальный site package с content_source.kind=vk"
  - id: SRC-USER-VK-ADS-CONTRACT
    kind: integration_contract
    owner: user
    status: not_provided
    required_for: "рекламный контур VK/Adman/AdTech"
  - id: SRC-CDNVIDEOHUB
    kind: integration_contract
    owner: user
    status: partially_provided
    received_at: "2026-08-22"
    received_as: "раздел CDNVIDEOHUB_KNOWLEDGE_PACK_v1.0 во втором change request"
    provided:
      - "контракт встраивания плеера → knowledge/cdnvideohub/PLAYER_CONTRACT.yaml"
    not_provided:
      - "Content API: endpoint, параметры, пагинация, лимиты и поля ответа"
    required_for: "синхронизация общего каталога из Content API"
    verified_against_official_docs: false
    note: >-
      Плеерная часть контракта передана и зафиксирована. Часть Content API в pack
      намеренно не приведена и должна быть взята из docs/CDNVIDEOHUB-METADATA-CONTRACT.md;
      этого документа в репозитории нет. Пробел закрыт источником
      SRC-CDNVIDEOHUB-CLIENT ниже — работающим официальным клиентом, а не пересказом.
      Сверка с сайтом провайдера не выполнялась: egress до player.cdnvideohub.com закрыт.

  - id: SRC-CDNVIDEOHUB-CLIENT
    kind: working_implementation
    owner: user
    status: approved
    path: /srv/sites/yummyani-staging/repo/src/modules/catalog/infrastructure/cdnvideohub/
    retrieved_at: "2026-08-24T21:00:00Z"
    purpose: >-
      Фактический контракт Content API CDNVideoHub: база, endpoint, курсорная
      пагинация, фильтры, поиск, соответствие полей, таймауты и коды ошибок.
    required_for: "синхронизация каталога Lords из Content API"
    verified_against_official_docs: false
    verified_against_working_client: true
    files:
      - path: constants.ts
        sha256: cd690a45aa4d35ce758bcf74360fd7f9632daf35e092ff96831899f11d730ef3
      - path: client.ts
        sha256: 6e98faf8aed809e0b9028ffecfd2a44c0ca27b62f18c3edf47e9a5c987ddc4a4
      - path: mapper.ts
        sha256: 7f4e0d25ad6523e821895691ab1010b084290227ab91fd3bb69b0e2350b2d4a6
      - path: validator.ts
        sha256: 1c7b0753c262339623a188b5f41c713779b473628060fea65e25bf0aa418de8c
      - path: ../../../playback/cdn-video-hub/contract.ts
        sha256: a9eea70e95408534990806abf76c3a5fc224ed016cdba822d20abd94ffbf8676
    conclusions:
      - "База метаданных: https://public-api.cdnvideohub.com/api/v1/ ; прежняя api.cdnvideohub.com объявлена устаревшей."
      - "Авторизация: заголовок Authorization: Bearer <token>, Accept: application/json; токен серверный, браузеру не передаётся."
      - "Пагинация курсорная: cursor + limit (max 100), ответ items / next_cursor / has_more / total."
      - "Endpoint: titles, titles/{id}, titles/search, titles/filters, titles/{id}/seasons, .../episodes, genres, countries."
      - "Плеер: https://player.cdnvideohub.com/s2/stable/video-player.umd.js, кастомный элемент <video-player>, без iframe."
      - "Плеер адресуется парой data-aggregator (kp|mali|mdl) + data-title-id, publisher-id обязан быть положительным целым."
      - "Переключение серий — методы selectSeason/selectEpisode на элементе, а не перезагрузка страницы."
      - "Endpoint подборок в клиенте отсутствует: раздел collections не включается."
    not_provided:
      - "официальная спецификация провайдера (docs/doc.json) в репозиторий не передавалась"
    note: >-
      Источник read-only. Учётные данные YummyAnime не читались и не переносятся:
      Lords работает на собственных api-token и publisher-id. Бренд, тексты,
      дизайн и содержимое YummyAnime не копировались — перенесён только
      технический контракт обращения к стороннему API.

  # ---------- официальная документация Яндекса (задание об автоматизации аналитики) ----------
  # Прочитана из этой сессии: egress до yandex.ru/yandex.com открыт, TCP 443 до
  # api-metrika.yandex.net и api.webmaster.yandex.net проверен. Выжимка —
  # knowledge/YANDEX_ANALYTICS_CONTRACT.yaml. Неофициальные пересказы не использовались.
  - id: SRC-YA-METRIKA-AUTH
    kind: official_documentation
    owner: Yandex
    url: https://yandex.ru/dev/metrika/en/intro/authorization
    retrieved_at: "2026-08-23T18:00:00Z"
    purpose: "формат заголовка авторизации Метрики"
    status: approved
    conclusions:
      - "Заголовок ровно один: `Authorization: OAuth <token>`."
      - "Передача токена query-параметром в документации не описана — не используется."
  - id: SRC-YA-METRIKA-COUNTERS-LIST
    kind: official_documentation
    owner: Yandex
    url: https://yandex.ru/dev/metrika/en/management/openapi/counter/counters
    retrieved_at: "2026-08-23T18:00:00Z"
    purpose: "поиск существующего счётчика по домену — основа идемпотентности"
    status: approved
    conclusions:
      - "GET /management/v1/counters; параметры status, per_page, offset, field, search_string."
      - "Ответ: {rows, counters[]}; у счётчика есть id, name, status, site2.site, mirrors2, webvisor, goals."
      - "offset начинается с 1, per_page по умолчанию 1000 — пагинация обязательна для честного «не найдено»."
  - id: SRC-YA-METRIKA-COUNTER-ADD
    kind: official_documentation
    owner: Yandex
    url: https://yandex.ru/dev/metrika/en/management/openapi/counter/addCounter
    retrieved_at: "2026-08-23T18:00:00Z"
    purpose: "создание счётчика"
    status: approved
    conclusions:
      - "POST /management/v1/counters, тело {\"counter\": {...}}; обязательны name и site2.site."
      - "gdpr_agreement_accepted — необязательное поле; фабрика по умолчанию его не отправляет."
      - "webvisor — необязательный объект; фабрика его не отправляет, Вебвизор остаётся выключенным."
  - id: SRC-YA-METRIKA-GOAL-ADD
    kind: official_documentation
    owner: Yandex
    url: https://yandex.ru/dev/metrika/en/management/openapi/goal/addGoal
    retrieved_at: "2026-08-23T18:00:00Z"
    purpose: "создание JavaScript-целей"
    status: approved
    conclusions:
      - "POST /management/v1/counter/{counterId}/goals, тело {\"goal\": {...}}."
      - "JavaScript-событие — type: action с conditions[{type: exact, url: <идентификатор>}]."
      - "Всего 13 типов целей; фабрика использует только action."
  - id: SRC-YA-METRIKA-STAT
    kind: official_documentation
    owner: Yandex
    url: https://yandex.com/dev/metrika/en/stat/openapi/data
    retrieved_at: "2026-08-23T18:00:00Z"
    purpose: "ежедневный read-only сбор показателей"
    status: approved
    conclusions:
      - "GET https://api-metrika.yandex.net/stat/v1/data; обязательны ids и metrics."
      - "Ответ содержит data, totals, total_rows, sampled, sample_share."
      - "Префиксы ym:s: (визиты) и ym:pv: (просмотры) нельзя смешивать в одном запросе."
  - id: SRC-YA-WEBMASTER-HOSTS-ADD
    kind: official_documentation
    owner: Yandex
    url: https://yandex.ru/dev/webmaster/doc/en/reference/hosts-add-site
    retrieved_at: "2026-08-23T18:00:00Z"
    purpose: "добавление сайта в Вебмастер"
    status: approved
    conclusions:
      - "POST /v4/user/{user-id}/hosts с телом {\"host_url\": \"…\"}; ответ 201 {\"host_id\": …}."
      - "409 HOST_ALREADY_ADDED — это идемпотентность, а не ошибка."
      - "user-id берётся из GET /v4/user и обязателен для всех ресурсов."
  - id: SRC-YA-WEBMASTER-VERIFICATION
    kind: official_documentation
    owner: Yandex
    url: https://yandex.com/dev/webmaster/doc/en/reference/host-verification-get
    retrieved_at: "2026-08-23T18:00:00Z"
    purpose: "маркер и статус подтверждения прав"
    status: approved
    conclusions:
      - "GET …/verification возвращает verification_state, verification_uin, applicable_verifiers."
      - "verification_state: NONE | VERIFIED | IN_PROGRESS | VERIFICATION_FAILED | INTERNAL_ERROR."
      - "Ни одно из этих значений не эквивалентно «сайт проиндексирован»."
  - id: SRC-YA-WEBMASTER-VERIFY-EXAMPLE
    kind: official_documentation
    owner: Yandex
    url: https://yandex.ru/dev/webmaster/doc/en/concepts/verification
    retrieved_at: "2026-08-23T18:00:00Z"
    purpose: "точный вид маркера подтверждения"
    status: approved
    conclusions:
      - "META_TAG: <meta name=\"yandex-verification\" content=\"<код>\" /> в head главной страницы."
      - "HTML_FILE: файл yandex_<код>.html в корне сайта с телом «Verification: <код>»."
      - "Запуск проверки: POST …/verification?verification_type=META_TAG|HTML_FILE|DNS."
  - id: SRC-YA-WEBMASTER-RESOURCES
    kind: official_documentation
    owner: Yandex
    url: https://yandex.com/dev/webmaster/doc/en/concepts/getting-started
    retrieved_at: "2026-08-23T18:00:00Z"
    purpose: "перечень read-only ресурсов для ежедневного отчёта"
    status: approved
    conclusions:
      - "summary, indexing/history, search-urls/in-search/history, search-queries/popular, links/external/samples, diagnostics, sitemaps."
  - id: SRC-USER-YANDEX-OAUTH
    kind: credential
    owner: user
    status: provided
    received_at: "2026-08-23"
    provided:
      - "OAuth-токен размещён владельцем на claude-control-01 в файле root:root 0600 вне репозитория"
      - "владелец вручную подтвердил METRIKA_API=200 и WEBMASTER_API=200"
    not_provided:
      - "чтение файла пользователю claude: каталог секретов закрыт (drwx------ root:root)"
    required_for: "реальные вызовы Management API из-под сервисной учётной записи"
    note: >-
      Значение токена в сессию не передавалось, не запрашивалось и не выводилось.
      Client secret для работы не нужен и не запрашивался.
  - id: SRC-YA-METRIKA-COUNTER-EDIT
    kind: official_documentation
    owner: Yandex
    url: https://yandex.com/dev/metrika/en/management/openapi/counter/editCounter
    retrieved_at: "2026-08-23T20:55:00Z"
    purpose: "выключение Вебвизора у уже созданного счётчика"
    status: approved
    conclusions:
      - "PUT /management/v1/counter/{counterId}, тело {\"counter\": CounterEdit}."
      - "Частичное обновление поддерживается: передаются только изменяемые поля."
      - "WebvisorOptions: urls, arch_enabled, arch_type, load_player_type, wv_version, wv_forms."
