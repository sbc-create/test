# Какая витрина каким производителем связей обслуживается.
#
# Настройка, а не код, по той же причине, по которой в ядре нет имён витрин:
# добавление витрины должно быть правкой настройки. Список производителей при
# этом закрыт и живёт в коде — новый производитель это новый адаптер, а не
# строка здесь.
#
# Два вида производителей отличаются тем, откуда берётся адрес страницы:
#
#   lords            — адрес вычисляется функцией движка витрины и её же
#                      правилом разведения совпадений. Отсюда номерные адреса,
#                      зависящие от порядка ответа источника, и неоднозначные
#                      маршруты, которые закрываются fail-closed.
#   declared-routes  — витрина объявляет соответствие сама, таблицей маршрутов.
#                      Ни номерных адресов, ни неоднозначности не возникает.

version: "1.0.0"

# `detailCache` — каталог сохранённых ответов detail поставщика. Списочный
# ответ несёт из описательных полей один год; жанры, страны, хронометраж,
# съёмочную группу и описание отдаёт detail, и они уже лежат на диске. Без
# этой строки выгрузка их не видит, и потребитель получает пустое описание при
# наличных сведениях.
sites:
  lords-01:
    producer: computed-routes
    catalog: var/lords/lords/catalog-cache/lords-01.json
    detailCache: var/lords/detail-cache
  lords-02:
    producer: computed-routes
    catalog: var/lords/lords/catalog-cache/lords-02.json
    detailCache: var/lords/detail-cache
  lords-03:
    producer: computed-routes
    catalog: var/lords/lords/catalog-cache/lords-03.json
    detailCache: var/lords/detail-cache

  yummyani-site:
    producer: declared-routes
    routes: var/yummyani/routes/yummyani-site.json
    catalog: var/lords/lords/catalog-cache/lords-01.json
  yummyani-org:
    producer: declared-routes
    routes: var/yummyani/routes/yummyani-org.json
    catalog: var/lords/lords/catalog-cache/lords-01.json
  yummyani-biz:
    producer: declared-routes
    routes: var/yummyani/routes/yummyani-biz.json
    catalog: var/lords/lords/catalog-cache/lords-01.json
