# Ключ модератора для nova-animedia-01.service (animedia.icu).
#
# Ставится как drop-in:
#   /etc/systemd/system/nova-animedia-01.service.d/10-community-moderator.conf
#
# ЗАЧЕМ. Премодерация комментариев включена модулем сообщества: каждое
# сообщение уходит в очередь и видно только автору. Без модератора очередь
# работает без двери — одобрить сообщение некому, и лента остаётся пустой при
# исправно работающих формах. ПУСТОЙ ключ означает «модератора нет», а не
# «модератор любой», поэтому дыры из-за отсутствия файла не возникает — только
# неработающая очередь.
#
# ПОЧЕМУ LoadCredential, А НЕ Environment. `Environment=` кладёт значение в
# сам юнит: оно видно в `systemctl show`, в `/proc/<pid>/environ` и утекает в
# любой отчёт, снявший окружение процесса. LoadCredential кладёт файл в
# приватный каталог службы и убирает его вместе со службой; рантайм читает
# его из $CREDENTIALS_DIRECTORY.
#
# ЧТО СДЕЛАТЬ ВЛАДЕЛЬЦУ (действие под root, значение здесь не приводится):
#
#   install -d -m 0700 /etc/site-factory/secrets/animedia/animedia-01
#   # записать значение ключа в файл, не оставляя его в истории оболочки:
#   install -m 0600 /dev/null /etc/site-factory/secrets/animedia/animedia-01/community-moderator-key
#   ${EDITOR:-nano} /etc/site-factory/secrets/animedia/animedia-01/community-moderator-key
#   install -D -m 0644 <этот файл> \
#     /etc/systemd/system/nova-animedia-01.service.d/10-community-moderator.conf
#   systemctl daemon-reload && systemctl restart nova-animedia-01.service
#
# ПРОВЕРКА ПОСЛЕ УСТАНОВКИ. Модератор ставит себе куку `amd_mod` со значением
# ключа; на странице тайтла у него появляется блок «На проверке» с кнопками.
# Посторонний блока не видит, и его попытка отправить решение отвечает
# `?community=forbidden`. Значение ключа в проверку не печатается.
[Service]
LoadCredential=animedia_community_moderator_key:/etc/site-factory/secrets/animedia/animedia-01/community-moderator-key
