# Источники единой записи сайта.
#
# Настройка, а не код: ядру не положено знать имена конкретных витрин и
# способов их обслуживания. Здесь объявлено, где искать рантайм и как долго
# измерение считается свежим; сами измерения складывает сборщик.

version: 1

runtime:
  # Корень каталогов рантайма витрин. Ссылка `current` внутри каждой указывает
  # на действующий релиз, а манифест рядом описывает, чем он собран.
  root: /srv/lords
  manifest: release-manifest.json

staleness:
  # Обновление каталога ходит каждые десять минут. Измерение старше половины
  # суток означает, что молчит сборщик, а не что данные не менялись.
  seconds: 43200

collectors:
  # Сборщик измерений и то, что он вправе спрашивать. Пустой список источника
  # означает «не подключён» — и запись честно скажет NOT_CONNECTED вместо нуля.
  health:
    enabled: true
    probe: http
  analytics:
    enabled: false
    reason: учётные данные внешнего счётчика не переданы
  search_console:
    enabled: false
    reason: доступ не выдан
