# Пространства имён внешних идентификаторов контракта `seo-route-binding`.
#
# Список живёт настройкой, а не кодом ядра, по той же причине, по которой в
# ядре нет имён витрин: перечень поставщиков — знание предметной области.
# Ядро обязано уметь работать с любым перечнем и не обязано знать конкретный.
# Гейт нейтральности это и потребовал, поймав слово «anime» внутри
# «myanimelist» в исходнике ядра.
#
# Присутствие в списке означает ровно одно: идентификатор такого пространства
# переносится в контракт как есть. Права обещать просмотр он не даёт —
# это решает отдельный перечень авторизованных идентификаторов
# (`playback-identifiers.yaml` и контракт поставщика).
#
# Идентификатор из пространства, которого здесь нет, в контракт не попадает.
# Не отбрасывается тихо: запись сохраняет остальные идентификаторы, а
# отсутствие неизвестного видно по тому, что его нет.

version: "1.0.0"

namespaces:
  # Агрегаторы воспроизведения. Право обещать просмотр даёт не этот список,
  # а авторизация в контракте поставщика.
  - kp
  - mali
  - mdl
  # Идентификаторы, которыми воспроизведение адресовать нельзя, но которые
  # полезны для сопоставления записей между источниками.
  - imdb
  - cvh
  - myanimelist
  - shikimori
  - tmdb
