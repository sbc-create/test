# Словарь написаний, по которым узнаётся вид произведения.
#
# Файл отдельный, потому что это данные поставщика, а не логика ядра.
# Универсальному слою запрещено называть предметную область (правило 4 гейта
# границ), и слово «anime» в коде ядра гейт справедливо поймал: завтра
# появится источник, называющий то же самое иначе, и править придётся код.
#
# Таблица, а не эвристика. Написания, которого здесь нет, дают UNKNOWN — и это
# правильный ответ: незнакомое написание означает, что источник изменился, и
# узнать об этом лучше по UNKNOWN в отчёте, чем по неверной разметке в выдаче.

schema_version: 1
vocabulary_version: "content-kind-vocabulary/1.0.0"

# Написание источника → вид произведения.
aliases:
  MOVIE: [movie, film, feature, фильм]
  SERIES: [series, tvseries, tv, tvshow, show, сериал, tv_series]
  MINISERIES: [miniseries, минисериал]
  SEASON: [season, сезон]
  EPISODE: [episode, серия, эпизод]
  OVA: [ova]
  OAD: [oad]
  ONA: [ona]
  SPECIAL: [special, specials, tvspecial, спецвыпуск]
  SHORT: [short, shortfilm, короткометражка]
  MUSIC: [music, musicvideo, pv, клип]
  DOCUMENTARY: [documentary, документальный]

# Способ исполнения. Видом произведения НЕ является и им не становится:
# произведение в этой технике бывает и фильмом, и сериалом. Прежнее
# отображение такого написания в отдельный «вид» запрещало сериалу иметь
# серии, и 133 записи получили сезоны у несериального типа.
animation_markers: [anime, аниме, cartoon, мультфильм, animation, анимация, мультсериал]

# Теги, несущие вид. Только они: остальные теги — возрастные пометки, жанры и
# служебные отметки источника, и вид из них не следует.
kind_tags:
  OVA: [ova]
  OAD: [oad]
  ONA: [ona]
  SPECIAL: [special, specials]
  SHORT: [short]
  MUSIC: [music, pv]
  DOCUMENTARY: [documentary]
