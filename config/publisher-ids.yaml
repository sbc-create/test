# Publisher ID семейств витрин — какое значение витрина семейства вправе получить.
#
# Зачем отдельный файл. Значение приезжает витрине из Secret Hub и раньше нигде
# не сверялось: операция подключения читала пару профиля и писала прочитанное в
# боковой файл как есть. Пока пара у семейства одна, это работает; в день, когда
# витрине подставили пару другого семейства, витрина ответила бы 200 и показала
# чужой каталог — отличить это от исправной работы было нечем.
#
# Что здесь лежит и чего здесь нет:
#
# * здесь — ОЖИДАНИЕ: какое значение допустимо у семейства. Это не выдача
#   доступа и не credential. Publisher ID провайдера публичен по построению:
#   рендерер печатает его в разметку атрибутом data-publisher-id, и он уходит
#   в браузер каждого посетителя. Сверять публичный идентификатор с ожиданием
#   можно только имея ожидание записанным;
# * здесь НЕТ ключей, токенов и паролей. Путь к паре профиля остаётся
#   secret_ref в config/site-profiles/<site>.json, значение пары — в Secret Hub
#   и в git не попадает. Файл ничего не выдаёт: он только отвергает.
#
# Правило разрешения (factory/site_engine/publisher_policy.py):
#   1. семейство витрины берётся из config/site-profiles/<site>.json, поле family;
#   2. семейство, не описанное в families, НЕ проверяется вовсе — так Lords,
#      Yummy и прочие проходят операцию с прежним поведением;
#   3. у описанного семейства значение обязано совпасть с publisher_id;
#   4. значение из retired отвергается у любого описанного семейства;
#   5. нечисловое значение и значение с ведущим нулём отвергаются: плеер зовёт
#      Number(publisherId), и такое значение даёт NaN и 400 у провайдера.
#
# Автоматической подстановки «похожего» значения не существует: отсутствие
# пригодного значения — это отказ операции, а не повод взять соседнее.

schema_version: 1
policy_version: "1.0.0"

families:
  animedia:
    publisher_id: "10252"
    credential_profile: yami
    note: >-
      Витрины animedia.icu (animedia-01) и animedia.space (animedia-02).
      Пара профиля yami; значение пары — в Secret Hub.
  zona:
    publisher_id: "10238"
    credential_profile: lords
    note: >-
      Витрина zonafilm.space (zona-01). Семейство исторически обслуживается
      парой профиля lords (секрет витрины lords-01) — см. player.publisher_id_ref
      в config/site-profiles/zona-01.json. Совпадение значения с семейством
      Lords здесь ожидаемо и не является ошибкой; развязка пар — отдельное
      решение, требующее записи в Secret Hub.

# Значения, снятые с обращения. Витрина описанного семейства не получает их ни
# при каком профиле. Исторические evidence и журналы, где эти значения
# упоминаются, не переписываются: здесь перечислены ДЕЙСТВУЮЩИЕ запреты.
retired:
  - "10331"
  - "10332"
  - "10333"

# Домены, за которыми семейство закреплено до выкладки. Запись здесь не создаёт
# витрину, не трогает DNS и не выдаёт доступ — она лишь не даёт выложить домен
# под значением другого семейства.
onboarding:
  - domain: zonafilm.cc
    family: zona
    state: not_deployed
    note: >-
      Витрина не развёрнута: тенанта в config/site-profiles/ нет, в закрытом
      перечне целей PLAYER_CONFIGURE домена нет. При развёртывании семейство
      zona даёт значение 10238. DNS этой записью не меняется.
