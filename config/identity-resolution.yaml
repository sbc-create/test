# Веса и пороги сопоставления произведений.
#
# Файл отдельный, а не константы в коде, по одной причине: пороги придётся
# обсуждать и оспаривать, а спорить с числом, спрятанным в функции, нельзя.
# Здесь их видно, они версионированы, и каждое изменение — это правка
# контракта с прогоном fixtures.
#
# Статус: PROPOSAL. Числа подобраны на adversarial-наборе и НЕ подтверждены
# боевым разбором вручную. До подтверждения владельцем контура порог
# AUTO_ACCEPT не понижается ни при каких обстоятельствах: понижение ради
# «процента распознавания» — это перекладывание ошибки на выдачу.

schema_version: 1
policy_version: "identity-resolution/1.0.0-proposal"
status: proposal
proposed_at: "2026-09-05"
resolver_version: "identity-resolver/1.0.0"

# --------------------------------------------------------------------------
# Пороги
# --------------------------------------------------------------------------
thresholds:
  auto_accept: 0.98
  review: 0.85
  # Разрыв между двумя лучшими кандидатами, ниже которого выбор считается
  # неоднозначным. Один и тот же тайтл в двух записях источника отличается
  # мелочами, и «лучший» из них — это подбрасывание монеты.
  ambiguity_margin: 0.03
  note: >-
    ниже review — UNMATCHED. Промежуточное состояние REVIEW существует не для
    статистики: запись с 0,9 достаточно похожа, чтобы её стоило посмотреть, и
    недостаточно, чтобы привязать без человека.

# --------------------------------------------------------------------------
# Веса признаков
# --------------------------------------------------------------------------
#
# Сумма весов не нормируется здесь намеренно: часть признаков у записи
# отсутствует, и делить надо на сумму ПРИМЕНИМЫХ, а не всех. Иначе запись без
# студии и создателей никогда не дойдёт до порога, сколько бы совпадений у
# неё ни было.
weights:
  external_id: 1.00        # точный внешний идентификатор
  original_title: 0.40     # оригинальное название
  alternative_title: 0.25  # альтернативное название
  year: 0.30
  content_kind: 0.30
  duration: 0.15
  episode_count: 0.20
  country: 0.10
  studio: 0.15
  creators: 0.15

# Насколько признак должен совпасть, чтобы считаться совпавшим.
tolerances:
  # Год выпуска и год релиза в стране расходятся регулярно и законно.
  year_slack: 1
  # Длительность источники округляют по-разному.
  duration_percent: 0.10
  duration_absolute_minutes: 5
  # Число эпизодов расходится, пока сезон выходит.
  episode_count_slack: 1
  # Порог похожести строк, ниже которого названия считаются разными.
  title_similarity: 0.90

# --------------------------------------------------------------------------
# Достаточность доказательств
# --------------------------------------------------------------------------
#
# Оценка одна не решает. Доля считается от ПРИМЕНИМЫХ признаков, поэтому
# запись, у которой применим ровно один, получает 1,0 при единственном
# совпадении. На adversarial-наборе так привязывалась запись без года к записи
# с годом — по одному лишь названию.
evidence:
  # Сколько признаков обязано совпасть, чтобы привязка была автоматической.
  min_matched_features_for_auto: 3
  # Похожесть названия автоматическую привязку не обосновывает: «Побег» и
  # «Побеги» похожи на 0,91 и являются разными произведениями. Нужно либо
  # точное совпадение нормализованного названия, либо внешний идентификатор.
  require_exact_title_or_external_id_for_auto: true

# --------------------------------------------------------------------------
# Жёсткие противоречия
# --------------------------------------------------------------------------
#
# Противоречие не понижает оценку, а закрывает кандидата. Разница
# принципиальная: понижение позволяет набрать порог другими признаками, и
# фильм привяжется к сериалу, если у них совпали название, год и страна.
hard_conflicts:
  - id: KIND_MOVIE_VS_SERIES
    rule: "фильм против сериала"
  - id: YEAR_INCOMPATIBLE
    rule: "год расходится больше допуска и расхождение дат релиза не доказано"
  - id: EPISODE_COUNT_INCOMPATIBLE
    rule: "несовместимое число сезонов или эпизодов"
  - id: ORIGINAL_VS_REMAKE
    rule: "оригинал против ремейка"
  - id: SEASON_VS_SPECIAL
    rule: "обычный сезон против OVA, ONA или спецвыпуска"
  - id: EXTERNAL_ID_DIFFERS
    rule: "у записей разные внешние идентификаторы одного и того же источника"
  - id: ORIGIN_DIFFERS
    rule: "существенное расхождение страны, студии или создателей"

# --------------------------------------------------------------------------
# Лестница сопоставления
# --------------------------------------------------------------------------
#
# Порядок обязателен. Совпадение русского названия стоит последним и само по
# себе решением не является ни на одной ступени.
ladder:
  - step: 1
    id: EXACT_EXTERNAL_ID
    status_on_match: RESOLVED_EXACT_ID
    requires: [external_id]
  - step: 2
    id: EXACT_PROVIDER_ASSET_ID
    status_on_match: RESOLVED_EXACT_ID
    requires: [provider_asset_id]
    note: "только при подтверждённой связи, а не по совпадению строки"
  - step: 3
    id: ORIGINAL_TITLE_YEAR_KIND
    status_on_match: RESOLVED_HIGH_CONFIDENCE
    requires: [original_title, release_year, content_kind]
  - step: 4
    id: ALTERNATIVE_TITLE_YEAR_PLUS
    status_on_match: RESOLVED_HIGH_CONFIDENCE
    requires: [alternative_title, release_year]
    plus_any_of: [content_kind, duration, episode_count, country, studio]
  - step: 5
    id: NORMALIZED_TITLE_YEAR_PLUS
    status_on_match: RESOLVED_HIGH_CONFIDENCE
    requires: [normalized_title, release_year]
    plus_any_of: [country, studio, creators, duration, episode_count]
    note: >-
      одного нормализованного названия с годом недостаточно: «Хищник» 1987 и
      «Хищник» 2018 различаются годом, а два разных фильма одного года —
      только этими дополнительными признаками
  - step: 6
    id: MANUAL_QUEUE
    status_on_match: AMBIGUOUS
    note: "очередь разбора; автоматического выбора здесь не происходит"
