# Реестр источников зрительских оценок.
#
# Разрешён ровно один источник: действующий договорный фид поставщика контента.
# Решение владельца от 2026-09-06, правовое основание и границы записаны в
# docs/rights/provider-feed-ratings.md.
#
# Скрапинг IMDb, Кинопоиска и любых других сайтов запрещён. Подключение новых
# внешних источников без отдельного разрешения запрещено.
#
# Правило, которое проверяется кодом: источник используется только при
# `authorization.status: granted`. Флаг `enabled` без разрешения — противоречие,
# и реестр с таким сочетанием не читается вовсе. Флаг, способный включить
# неразрешённый источник, обесценивает само разрешение.

version: 2

sources:
  - id: provider-feed
    enabled: true
    # Срок годности последнего известного значения. Час, а не шесть: фид
    # обновляется чаще, и держать вчерашние числа как свежие незачем.
    ttl_seconds: 3600
    # Предела частоты нет: значения читаются из уже загруженного фида, наружу
    # соединитель не ходит вовсе и ходить не может.
    rate_limit_per_minute: 0
    provenance:
      delivery: "поля фида каталога"
      legal_basis: "действующий договор с поставщиком контента"
      fields: ["imdb_rating", "kinopoisk_rating"]
    # Какая из двух метрик считается главной. Не выбрана: они меряют разные
    # совокупности зрителей, и выбор между ними — решение о представлении,
    # которого владелец не принимал. Пока не выбрано, отдаются обе.
    primary_metric: null
    authorization:
      status: granted
      reason: >-
        Разрешение владельца от 2026-09-06: использовать и показывать только те
        оценки, которые уже передаются в действующем договорном фиде поставщика.
      document: docs/rights/provider-feed-ratings.md
      granted_at: "2026-09-06"

  - id: imdb
    enabled: false
    ttl_seconds: 21600
    rate_limit_per_minute: 20
    authorization:
      status: absent
      reason: >-
        Прямое обращение к IMDb запрещено решением владельца от 2026-09-06:
        скрапинг сайта не разрешён. Разрешение на идентификатор IMDb в
        docs/BLOCKERS.md касается сопоставления записей, а не получения оценок.
        Оценка imdb_rating показывается только тогда, когда приходит в фиде.
      document: docs/rights/provider-feed-ratings.md
      granted_at: ""

  - id: kinopoisk
    enabled: false
    ttl_seconds: 21600
    rate_limit_per_minute: 30
    authorization:
      status: absent
      reason: >-
        Прямое обращение к Кинопоиску запрещено решением владельца от
        2026-09-06: скрапинг сайта не разрешён. Оценка kinopoisk_rating
        показывается только тогда, когда приходит в фиде поставщика.
      document: docs/rights/provider-feed-ratings.md
      granted_at: ""
