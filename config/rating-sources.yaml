# Реестр источников зрительских оценок.
#
# Ни один источник не разрешён. Это не пробел в настройке, а состояние дел:
# разрешение на использование чужих оценок даёт владелец, и подменять его
# нельзя ничем — ни сбором со страниц, ни средним по соседям, ни округлением.
#
# Правило одно и оно проверяется кодом: источник используется только при
# `authorization.status: granted`. Флаг `enabled` без разрешения — противоречие,
# и реестр с таким сочетанием не читается вовсе. Флаг, способный включить
# неразрешённый источник, обесценивает само разрешение.
#
# Чтобы разрешить источник, нужно: получить письменное согласие правообладателя
# или условия использования, положить их в docs/rights/, проставить здесь
# status: granted с датой и ссылкой на документ, и написать соединитель.

version: 1

sources:
  - id: kinopoisk
    enabled: false
    # Срок годности последнего известного значения. Оценки меняются медленно,
    # шесть часов — разумный размен между свежестью и нагрузкой на источник.
    ttl_seconds: 21600
    rate_limit_per_minute: 30
    authorization:
      status: absent
      reason: >-
        Разрешение не запрашивалось. Публичных условий, допускающих
        использование оценок на стороннем сайте, не найдено.
      document: ""
      granted_at: ""

  - id: imdb
    enabled: false
    ttl_seconds: 21600
    rate_limit_per_minute: 20
    authorization:
      status: absent
      reason: >-
        В docs/BLOCKERS.md зафиксировано разрешение владельца на использование
        идентификатора IMDb для СОПОСТАВЛЕНИЯ, а не на получение и показ
        оценок. Это разные права, и первое не влечёт второго.
      document: docs/BLOCKERS.md
      granted_at: ""

  - id: provider-feed
    enabled: false
    # Поставщик каталога отдаёт поля imdb_rating и kinopoisk_rating. Право на
    # их показ вытекает из договора с поставщиком, а договор в реестре
    # источников не зарегистрирован — значит, права не подтверждены.
    ttl_seconds: 3600
    rate_limit_per_minute: 0
    authorization:
      status: absent
      reason: >-
        Договор с поставщиком каталога не зарегистрирован в
        knowledge/SOURCE_REGISTRY.yaml как источник оценок. Поля в выдаче есть,
        подтверждённого права на их показ нет.
      document: ""
      granted_at: ""
