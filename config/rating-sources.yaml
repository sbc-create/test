# Реестр источников зрительских оценок.
#
# Разрешён ровно один источник: действующий договорный фид поставщика контента.
# Решение владельца от 2026-09-06, правовое основание и границы записаны в
# docs/rights/provider-feed-ratings.md.
#
# Скрапинг IMDb, Кинопоиска и любых других сайтов запрещён. Подключение новых
# внешних источников без отдельного разрешения запрещено.
#
# Правило, которое проверяется кодом: источник используется только при
# `authorization.status: granted`. Флаг `enabled` без разрешения — противоречие,
# и реестр с таким сочетанием не читается вовсе. Флаг, способный включить
# неразрешённый источник, обесценивает само разрешение.

version: 3

# Примечание: shikimori/animemedia ниже — документальные записи для factory/ratings.
# Витринный site_engine по-прежнему считает единственным enabled+granted источником
# provider-feed (shikimori.enabled=false).

sources:
  - id: provider-feed
    enabled: true
    # Срок годности последнего известного значения. Час, а не шесть: фид
    # обновляется чаще, и держать вчерашние числа как свежие незачем.
    ttl_seconds: 3600
    # Предела частоты нет: значения читаются из уже загруженного фида, наружу
    # соединитель не ходит вовсе и ходить не может.
    rate_limit_per_minute: 0
    provenance:
      delivery: "поля фида каталога"
      legal_basis: "действующий договор с поставщиком контента"
      fields: ["imdb_rating", "kinopoisk_rating"]
    # Какая из двух метрик считается главной. Не выбрана: они меряют разные
    # совокупности зрителей, и выбор между ними — решение о представлении,
    # которого владелец не принимал. Пока не выбрано, отдаются обе.
    primary_metric: null
    authorization:
      status: granted
      reason: >-
        Разрешение владельца от 2026-09-06: использовать и показывать только те
        оценки, которые уже передаются в действующем договорном фиде поставщика.
      document: docs/rights/provider-feed-ratings.md
      granted_at: "2026-09-06"

  - id: imdb
    enabled: false
    ttl_seconds: 21600
    rate_limit_per_minute: 20
    authorization:
      status: absent
      reason: >-
        Прямое обращение к IMDb запрещено решением владельца от 2026-09-06:
        скрапинг сайта не разрешён. Разрешение на идентификатор IMDb в
        docs/BLOCKERS.md касается сопоставления записей, а не получения оценок.
        Оценка imdb_rating показывается только тогда, когда приходит в фиде.
      document: docs/rights/provider-feed-ratings.md
      granted_at: ""

  - id: kinopoisk
    enabled: false
    ttl_seconds: 21600
    rate_limit_per_minute: 30
    authorization:
      status: absent
      reason: >-
        Прямое обращение к Кинопоиску запрещено решением владельца от
        2026-09-06: скрапинг сайта не разрешён. Оценка kinopoisk_rating
        показывается только тогда, когда приходит в фиде поставщика.
      document: docs/rights/provider-feed-ratings.md
      granted_at: ""

  # factory/ratings pipeline; не витринный site_engine connector.
  # enabled=false → не попадает в site_engine.authorized (ровно provider-feed).
  - id: shikimori
    enabled: false
    ttl_seconds: 86400
    rate_limit_per_minute: 60
    provenance:
      delivery: "official GraphQL API via factory/ratings"
      endpoint: "https://shikimori.io/api/graphql"
      score_semantics: "shikimori score (not MAL)"
      vote_count: "sum(scoresStats.count)"
    authorization:
      status: granted
      reason: >-
        Stage-1 owner request 2026-09-19: централизованный ratings ingestion
        через официальный GraphQL. Витринный слой не включает источник
        напрямую (enabled=false); runtime — factory/ratings. Production
        timer / live snapshot — Stage 2.
      document: docs/rights/shikimori-ratings.md
      granted_at: "2026-09-19"

  - id: animemedia
    enabled: false
    ttl_seconds: 0
    rate_limit_per_minute: 0
    state: UNVERIFIED_DISABLED
    authorization:
      status: absent
      reason: >-
        Canonical origin, ownership, API/feed, attribution and rate limits
        not verified. Our animedia.icu/space sites are not external rating
        sources (cyclic provenance forbidden).
      document: docs/rights/animemedia-ratings.md
      granted_at: ""

  - id: amd_online
    enabled: false
    ttl_seconds: 86400
    rate_limit_per_minute: 6
    state: DISABLED_PERMISSION_MISSING
    provenance:
      delivery: "public detail HTML pages via factory/ratings"
      origin: "https://amd.online/"
      score_field: "multirating-itog-rateval"
      vote_field: "multirating-itog-votes"
    authorization:
      status: not_provided_recurring_disabled
      reason: >-
        Written permission NOT_PROVIDED. Stage 2/3 closed canary was one-shot.
        Stage 4 disables new AMD fetches; last-good retained. Public indexed
        publication remains BLOCKED.
      document: artifacts/evidence/ratings-ingestion-02/AMD_PERMISSION_STATUS.md
      granted_at: ""
      modes:
        AMD_CLOSED_CANARY_INGESTION: COMPLETED_STAGE2_3
        AMD_RECURRING_FETCHES: DISABLED
        AMD_PUBLIC_INDEXED_PUBLICATION: BLOCKED_PENDING_SEPARATE_APPROVAL
