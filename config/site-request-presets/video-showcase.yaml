# Пресет пакета для мастера заведения витрины.
#
# Значения, одинаковые для всех новых витрин профиля. Взяты из рабочего
# пакета, а не выдуманы: пакет из придуманных значений проходит схему и
# падает на первой же настоящей проверке. Поля со значением null оставлены
# намеренно — схема требует их присутствия.
#
# То, что спрашивает мастер, накладывается поверх: домен, среда, площадка,
# тема, название, правообладатель, типы содержимого и ссылки на секреты.
acceptance:
  accessibility:
    level: AA
    viewports:
    - 360
    - 390
    - 768
    - 1024
    - 1440
  max_major_findings: 25
  performance:
    field_targets:
      cls: 0.1
      inp_ms: 200
      lcp_ms: 2500
    lab_cls: 0.1
    lab_lcp_ms: 2500
    lab_total_bytes: 800000
  reference_screenshots: []
  routes:
  - expect_indexable: true
    expected_status: 200
    page_type: home
    path: /
  - expect_indexable: true
    expected_status: 200
    page_type: category
    path: /lekcii/
  - expect_indexable: true
    expected_status: 200
    page_type: paginated_page
    path: /lekcii/page/2/
  - expect_indexable: true
    expected_status: 200
    page_type: title
    path: /lekcii/material-01/
  - expect_indexable: true
    expected_status: 200
    page_type: episode
    path: /praktikum/serial-fikstura/season-1/episode-1/
  - expect_indexable: true
    expected_status: 200
    page_type: content_unavailable
    path: /praktikum/serial-fikstura/season-1/episode-3/
  - expect_indexable: true
    expected_status: 200
    page_type: news_index
    path: /news/
  - expect_indexable: true
    expected_status: 200
    page_type: legal
    path: /legal/terms/
  - expect_indexable: false
    expected_status: 200
    page_type: search
    path: /search/
  - expect_indexable: false
    expected_status: 404
    page_type: not_found
    path: /lekcii/page/999/
  - expect_indexable: false
    expected_status: 404
    page_type: not_found
    path: /arhiv/
  scenarios:
  - description: Пользователь открывает каталог, переходит на вторую страницу и открывает
      материал
    id: browse-catalog
    steps:
    - Открыть /lekcii/
    - Перейти по ссылке «Следующая»
    - Открыть первую карточку
  - description: Недоступный эпизод показывает статус, а не подменяется другим роликом
    id: unavailable-video
    steps:
    - Открыть эпизод 3
    - Убедиться, что показан блок недоступности
    - Убедиться, что плеера нет
  - description: Основные элементы достижимы с клавиатуры и имеют видимый focus
    id: keyboard-navigation
    steps:
    - Tab до skip-link
    - Активировать skip-link
    - Tab по основной навигации
